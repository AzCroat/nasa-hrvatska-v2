  <head>

    <meta name="theme-color" content="#0e7490" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

      rel="apple-touch-startup-image"

    <link

    <link

    <link

    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width:1024px) and (device-height:1366px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)"
      href="/splash/ipad-pro-12.png"
    />

    <!-- Icons -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nasahrvatska.com/" />
    <meta property="og:title" content="Naša Hrvatska — Learn Croatian Language & Culture" />
    <meta
      property="og:description"
      content="Learn Croatian with interactive lessons, grammar drills, cultural immersion, games, and spaced repetition. Free. No ads."
    />
    <meta property="og:image" content="https://nasahrvatska.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Naša Hrvatska" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Naša Hrvatska — Learn Croatian" />
    <meta
      name="twitter:description"
      content="Free interactive Croatian language learning with games, grammar, and cultural immersion."
    />
    <meta name="twitter:image" content="https://nasahrvatska.com/icon-512.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://nasahrvatska.com/" />

    <!-- Fonts: self-hosted woff2 — served from Cloudflare edge, no cross-origin DNS round-trip -->
    <!-- Preload the two most-visible font files (latin subset covers ASCII + common European chars) -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/playfair-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <meta name="color-scheme" content="light dark" />

    <!-- Pre-mount boot shell (styles + early theme). The static shell inside
         #root below paints as soon as HTML+CSS arrive and is replaced the
         instant React first renders — every millisecond before that used to be
         a blank white page (src/tests/firstPaintGraph.test.ts documents the
         incident). Inline on purpose: it must not depend on any asset the app
         bundle carries.
         E2E CONTRACT: the shell carries id="nh-boot". The smoke/offline/auth
         specs treat "#root has content AND #nh-boot is gone" as proof React
         mounted — a bare "#root is not empty" check is satisfied by this shell
         even when the app never boots. Renaming the id without updating those
         specs re-blinds the blank-screen smoke test; bootShell.test.ts pins
         the pairing. -->
    <style>
      html[data-theme='dark'] {
        background: #0b1120;
      }
      #nh-boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f4f6f9;
        color: #164e63;
      }
      html[data-theme='dark'] #nh-boot {
        background: #0b1120;
        color: #e2e8f0;
      }
      /* Belt-and-suspenders: if the theme init in native-init.js ever fails,
         follow the OS preference rather than flashing light at dark users. */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          background: #0b1120;
        }
        html:not([data-theme='light']) #nh-boot {
          background: #0b1120;
          color: #e2e8f0;
        }
      }
      .nh-boot-mark {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .nh-boot-spin {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(14, 116, 144, 0.25);
        border-top-color: #0e7490;
        animation: nh-boot-rot 0.9s linear infinite;
      }
      @keyframes nh-boot-rot {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .nh-boot-spin {
          animation: none;
        }
      }
    </style>

    <!-- Analytics (Plausible — privacy-first, no cookies) -->
    <!-- Set up at plausible.io and replace the data-domain if needed -->
    <script
      defer
      data-domain="nasahrvatska.com"
      src="https://plausible.io/js/plausible.js"
    ></script>
  </head>
  <body>
    <!-- Apply capacitor-native class synchronously before React mounts so CSS overrides
       take effect from the very first paint.
       Detection uses window.location.hostname === 'localhost' — set by the OS
       before any JS runs (Capacitor androidScheme:'https' → origin https://localhost).
       This is 100% race-condition-free; window.Capacitor bridge injection is async
       and unreliable at this point. -->
    <script src="/native-init.js"></script>

    <!-- Skip to main content for keyboard/screen reader users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root">
      <!-- Static boot shell — replaced by React's first render. No <h1> here
           on purpose (auth/guest specs assert the app's own h1); keep
           id="nh-boot" in sync with the E2E mount predicates (see the
           comment on the boot-shell <style> block in <head>). -->
      <div id="nh-boot" role="status" aria-label="Loading Naša Hrvatska">
        <div class="nh-boot-mark" aria-hidden="true">Naša Hrvatska</div>
        <div class="nh-boot-spin" aria-hidden="true"></div>
      </div>
    </div>

    <!-- SW update interceptor: runs before React mounts.
       If a new SW is already waiting, activate it and reload before
       the app renders stale cached content. Zero user action required. -->
    <script src="/sw-update.js"></script>

    <script src="/sw-migration.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
