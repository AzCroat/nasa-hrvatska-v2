# Ops diagnostic: are the live-media upstreams (HRT radio, CMC) actually
# reachable, and does the production /radio proxy resolve each station?
# Read-only; GitHub runners have unrestricted egress, unlike the dev sandbox.
# Prints HTTP status + content type per URL — no user data involved.
name: Media streams probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe upstream stream candidates
        run: |
          set -uo pipefail
          probe() {
            printf '%-95s' "$1"
            curl -sS -o /dev/null -m 10 -r 0-0 -L \
              -w "HTTP %{http_code}  type=%{content_type}\n" "$1" \
              || echo "FAILED (connect/timeout)"
          }
          echo "::group::HRT (StreamTheWorld mounts)"
          for m in PROGRAM1 PROGRAM2 PROGRAM3; do
            probe "https://playerservices.streamtheworld.com/api/livestream-redirect/${m}.mp3"
            probe "https://playerservices.streamtheworld.com/api/livestream-redirect/${m}AAC.aac"
            probe "https://playerservices.streamtheworld.com/api/livestream-redirect/${m}AAC_SC"
          done
          echo "::endgroup::"
          echo "::group::CMC"
          probe "https://radio.cmc.com.hr:8443/cmc_radio"
          probe "https://radio.cmc.com.hr/cmc_radio"
          echo "::endgroup::"

      - name: Discover CMC stream URL (both known upstreams are dead)
        run: |
          set -uo pipefail
          echo "::group::CMC player pages — extract stream URLs"
          for page in "https://cmc.com.hr/program/cmc-radio-stream/" \
                      "https://radio.cmc.com.hr" \
                      "https://cmc.com.hr"; do
            echo "--- $page"
            curl -sSL -m 15 "$page" 2>/dev/null \
              | grep -oE 'https?://[^"'"'"' <>]+\.(mp3|aac|aacp|m3u8)[^"'"'"' <>]*|https?://[^"'"'"' <>]*(stream|radio|listen|shoutcast|icecast)[^"'"'"' <>]*' \
              | sort -u | head -20 || echo "(no stream URLs found in page)"
          done
          echo "::endgroup::"
          echo "::group::CMC player JS bundles — the stream URL must live here"
          # Run 2 found no URLs in static HTML: the player is JS-driven. Pull
          # every script the player pages load and grep the bundles themselves.
          for page in "https://radio.cmc.com.hr" \
                      "https://cmc.com.hr/program/cmc-radio-stream/"; do
            echo "--- scripts on $page"
            curl -sSL -m 15 "$page" 2>/dev/null \
              | grep -oE 'src="[^"]+\.js[^"]*"' | sed 's/src="//;s/"$//' | sort -u | head -12 \
              | while read -r js; do
                  case "$js" in
                    http*) full="$js" ;;
                    /*) full="https://radio.cmc.com.hr$js" ;;
                    *) full="https://radio.cmc.com.hr/$js" ;;
                  esac
                  echo "  [bundle] $full"
                  curl -sSL -m 15 "$full" 2>/dev/null \
                    | grep -oE 'https?://[^"'"'"' <>\\]+(mp3|aac|m3u8|stream|8443|8000|cmc_radio|icecast|shoutcast|radio\.co|zeno\.fm|streaming)[^"'"'"' <>\\]*' \
                    | sort -u | head -12 || true
                done || echo "(no scripts found — page may be WAF-blocked)"
          done
          echo "(end of bundle scan)"
          echo "::endgroup::"
          echo "::group::CMC educated-guess probes"
          for u in "https://stream.cmc.com.hr/cmc_radio" \
                   "https://cmc.stream.studio.hr/cmc" \
                   "https://radio.cmc.com.hr:8000/cmc_radio" \
                   "https://radio.cmc.com.hr/stream" \
                   "https://radio.cmc.com.hr/listen" \
                   "https://radio.cmc.com.hr:8443/stream"; do
            printf '%-60s' "$u"
            curl -sS -o /dev/null -m 8 -r 0-0 -L \
              -w "HTTP %{http_code}  type=%{content_type}\n" "$u" \
              || echo "FAILED (connect/timeout)"
          done
          echo "::endgroup::"

      - name: CMC runtime-config hunt (inline scripts, plugin JS, admin-ajax)
        run: |
          set -uo pipefail
          # Run 3 identified the player as the WP "radio-player-premium" plugin.
          # Such plugins receive their stream URL via wp_localize_script (inline
          # <script> in the page HTML, which bundle greps never see) or fetch it
          # at runtime from admin-ajax.php. Hunt both.
          echo "::group::Inline scripts + data attributes on the player pages"
          for page in "https://radio.cmc.com.hr" \
                      "https://cmc.com.hr/program/cmc-radio-stream/"; do
            echo "===== $page ====="
            curl -sSL -m 15 "$page" -o /tmp/page.html 2>/dev/null || { echo "(fetch failed)"; continue; }
            python3 - <<'PY'
          import re
          html = open('/tmp/page.html', encoding='utf-8', errors='replace').read()
          hits = 0
          for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S | re.I):
              body = m.group(1).strip()
              if body and re.search(r'player|ajax|stream|radio|localize|bradmax', body, re.I):
                  hits += 1
                  print('----- inline script #%d -----' % hits)
                  print(body[:2500])
          for m in re.finditer(r'<[a-zA-Z][^>]*\bdata-[^>]*>', html):
              tag = m.group(0)
              if re.search(r'data-[a-z-]*(src|url|stream|config|player|uri|settings)\s*=', tag, re.I) \
                 and re.search(r'stream|player|radio|mp3|aac|8443', tag, re.I):
                  print('----- data attribute -----')
                  print(tag[:1200])
          if hits == 0:
              print('(no matching inline scripts)')
          # Run 4 gap: Elementor stores widget config HTML-entity-encoded
          # (data-settings="{&quot;streamURL&quot;:...}") and JSON escapes
          # slashes (https:\/\/) — both evade plain URL greps. frontend.js
          # confirms the config key is literally streamURL. Unescape, re-hunt.
          import html as H
          text = H.unescape(html).replace('\\/', '/')
          print('----- unescaped hunt: stream config keys -----')
          found = 0
          for m in re.finditer(r'"?[a-zA-Z_]*stream[a-zA-Z_]*"?\s*[:=]\s*"[^"]{4,300}"', text, re.I):
              found += 1
              print(m.group(0)[:400])
          for m in re.finditer(r'https?://[^"\s<>\']{8,250}', text):
              u = m.group(0)
              if re.search(r'\.(mp3|aac|aacp|m3u8)|:8443|:8000|cmc_radio|icecast|shoutcast|radio\.co|zeno\.fm|streaming|listen', u, re.I):
                  found += 1
                  print('[url]', u[:300])
          if not found:
              print('(nothing after unescape either)')
          PY
          done
          echo "::endgroup::"
          echo "::group::radio-player-premium frontend.js — endpoints and actions"
          curl -sSL -m 15 -o /tmp/fe.js \
            "https://radio.cmc.com.hr/wp-content/plugins/radio-player-premium/assets/js/frontend.js" \
            2>/dev/null || true
          wc -c /tmp/fe.js || true
          echo "-- ajax action names:"
          grep -oE "action['\"]?\s*[:=]\s*['\"][a-zA-Z0-9_-]+['\"]" /tmp/fe.js | sort -u | head -20 || echo "(none)"
          echo "-- endpoints:"
          grep -oE "(admin-ajax\.php|wp-json/[a-zA-Z0-9/_-]+)" /tmp/fe.js | sort -u | head -10 || echo "(none)"
          echo "-- absolute URLs:"
          grep -oE 'https?://[^"'"'"' <>\\)]+' /tmp/fe.js | sort -u | head -20 || echo "(none)"
          echo "-- config object keys mentioning stream/source:"
          grep -oE '[a-zA-Z_]*([Ss]tream|[Ss]ource|[Ss]rc)[a-zA-Z_]*\s*:' /tmp/fe.js | sort -u | head -15 || echo "(none)"
          echo "::endgroup::"
          echo "::group::admin-ajax probes (discovered + known plugin actions)"
          discovered=$(grep -oE "action['\"]?\s*[:=]\s*['\"][a-zA-Z0-9_-]+['\"]" /tmp/fe.js \
            | grep -oE "['\"][a-zA-Z0-9_-]+['\"]\$" | tr -d "'\"" | sort -u | head -8 || true)
          for a in $discovered radio_player_data get_radio_player rp_get_stream radio_player_settings; do
            printf '%-42s' "action=$a"
            body=$(curl -sS -m 10 -X POST "https://radio.cmc.com.hr/wp-admin/admin-ajax.php" \
              --data "action=$a" -w "\n[HTTP %{http_code}]" 2>/dev/null || echo "(request failed)")
            echo "$body" | head -c 600
            echo
          done
          echo "::endgroup::"

      - name: CMC via open radio directories (no CMC-site traffic)
        run: |
          set -uo pipefail
          # CMC's site now WAF-blocks runner traffic (run 6: 403 block pages).
          # The open radio directories publish stations' current stream URLs
          # without us touching CMC infrastructure at all.
          echo "::group::radio-browser.info API"
          resp=""
          for api in de1 nl1 at1 fi1; do
            resp=$(curl -sS -m 15 -H "User-Agent: nasahrvatska-media-probe/1.0" \
              "https://${api}.api.radio-browser.info/json/stations/search?name=cmc&countrycode=HR" \
              2>/dev/null) && [ -n "$resp" ] && { echo "(via ${api})"; break; }
          done || true
          printf '%s' "$resp" > /tmp/rb.json
          python3 - <<'PY'
          import json
          try:
              sts = json.load(open('/tmp/rb.json'))
          except Exception as e:
              print('parse failed:', e); sts = []
          cands = []
          for s in sts[:10]:
              print('%s | url=%s | resolved=%s | ok=%s | checked=%s' % (
                  s.get('name'), s.get('url'), s.get('url_resolved'),
                  s.get('lastcheckok'), s.get('lastchecktime')))
              for u in (s.get('url_resolved'), s.get('url')):
                  if u and u not in cands:
                      cands.append(u)
          open('/tmp/candidates.txt', 'w').write('\n'.join(cands))
          if not sts:
              print('(no stations returned)')
          PY
          echo "::endgroup::"
          echo "::group::radio.garden search"
          curl -sS -m 15 "https://radio.garden/api/search?q=CMC" 2>/dev/null > /tmp/rg.json || true
          python3 - <<'PY'
          import json, re
          try:
              d = json.load(open('/tmp/rg.json'))
              hits = d.get('hits', {}).get('hits', [])
          except Exception as e:
              print('parse failed:', e); hits = []
          shown = 0
          for h in hits:
              src = h.get('_source', {})
              title = src.get('title', '')
              if not re.search(r'\bcmc\b', title, re.I):
                  continue
              url = src.get('url', '')
              cid = url.rsplit('/', 1)[-1] if url else ''
              print('%s | %s | id=%s' % (title, src.get('subtitle', ''), cid))
              if cid:
                  open('/tmp/rg_ids.txt', 'a').write(cid + '\n')
              shown += 1
          if not shown:
              print('(no CMC hits)')
          PY
          if [ -s /tmp/rg_ids.txt ]; then
            while read -r cid; do
              printf '%-50s' "radio.garden channel $cid"
              curl -sS -o /dev/null -m 15 -w "HTTP %{http_code}  ->  %{redirect_url}\n" \
                "https://radio.garden/api/ara/content/listen/${cid}/channel.mp3" \
                || echo "FAILED"
              curl -sS -o /dev/null -m 15 -w "final: HTTP %{http_code}  type=%{content_type}  url=%{url_effective}\n" \
                -r 0-0 -L "https://radio.garden/api/ara/content/listen/${cid}/channel.mp3" \
                || echo "FAILED (follow)"
            done < /tmp/rg_ids.txt
          fi
          echo "::endgroup::"
          echo "::group::probe directory-listed candidates"
          if [ -s /tmp/candidates.txt ]; then
            while read -r u; do
              [ -n "$u" ] || continue
              printf '%-80s' "$u"
              curl -sS -o /dev/null -m 10 -r 0-0 -L \
                -w "HTTP %{http_code}  type=%{content_type}\n" "$u" \
                || echo "FAILED (connect/timeout)"
            done < /tmp/candidates.txt
          else
            echo "(no candidates from directories)"
          fi
          echo "::endgroup::"

      - name: CMC headless capture (run the player, sniff the audio request)
        run: |
          set -uo pipefail
          # Static scraping is exhausted (runs 2-5): the page hides the player
          # behind a Complianz soft cookie-wall and builds it with JS. Load the
          # page in a real browser, accept consent, click play, and capture the
          # network request the player actually makes. Read-only.
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/capture.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const hits = new Set();
            page.on('request', (r) => {
              const u = r.url();
              if (/\.(mp3|aac|aacp|m3u8)(\?|$)|:8443|:8000|cmc_radio|icecast|shoutcast|radio\.co|zeno|streamtheworld|admin-ajax/i.test(u)
                  && !/\.(js|css|png|jpe?g|svg|woff2?|gif|ico)(\?|$)/i.test(u)) {
                hits.add('REQ ' + u.slice(0, 300));
              }
            });
            page.on('response', (r) => {
              const ct = (r.headers()['content-type'] || '');
              if (/audio|mpegurl/i.test(ct)) hits.add('AUDIO-RESPONSE ' + r.url().slice(0, 300) + '  ct=' + ct);
            });
            try {
              await page.goto('https://radio.cmc.com.hr', { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(4000);
              for (const sel of ['.cmplz-accept', 'button.cmplz-accept', '.cmplz-btn.cmplz-accept']) {
                const el = await page.$(sel);
                if (el) { await el.click().catch(() => {}); console.log('consent accepted via', sel); break; }
              }
              await page.waitForTimeout(5000);
              const html = await page.content();
              const cfg = html.match(/[^"'\s]{0,40}(?:streamURL|stream_url|data-settings)[^>]{0,400}/gi) || [];
              cfg.slice(0, 10).forEach((x) => console.log('DOM:', x.slice(0, 400)));
              const urls = html.match(/https?:[^"'\s<>\\]+/g) || [];
              urls.filter((u) => /\.(mp3|aac|m3u8)|:8443|:8000|cmc_radio|icecast|shoutcast|zeno/i.test(u))
                  .slice(0, 10).forEach((u) => console.log('DOM-URL:', u.slice(0, 300)));
              const clicked = await page.evaluate(() => {
                const cands = Array.from(document.querySelectorAll('button, [class*="play"], [id*="play"]'))
                  .filter((e) => /play/i.test(e.className + ' ' + e.id + ' ' + (e.getAttribute('aria-label') || '')));
                cands.slice(0, 6).forEach((e) => { try { e.click(); } catch (err) {} });
                return cands.length;
              });
              console.log('play-like elements clicked:', clicked);
              await page.waitForTimeout(15000);
            } catch (e) {
              console.log('capture error:', e.message);
            }
            console.log('--- captured network hits ---');
            Array.from(hits).slice(0, 25).forEach((h) => console.log(h));
            if (!hits.size) console.log('(no stream-like network traffic observed)');
            await browser.close();
          })();
          JS
          node /tmp/capture.cjs

      - name: Probe production /radio proxy
        run: |
          set -uo pipefail
          echo "::group::Production proxy resolution"
          for s in hrt1 hrt2 hrt3 cmc; do
            printf '%-10s' "$s"
            curl -sS -o /dev/null -m 20 -w "HTTP %{http_code}  ->  %{redirect_url}\n" \
              "https://nasahrvatska.com/radio?s=${s}&fresh=1" \
              || echo "FAILED (connect/timeout)"
          done
          echo "::endgroup::"
