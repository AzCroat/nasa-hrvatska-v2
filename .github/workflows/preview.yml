name: Preview

# A TEST COPY OF THE SITE, NEVER THE LIVE SITE (owner request, 2026-11-19).
#
# Cloudflare's own preview builds have no Firebase keys (they live in GitHub secrets and
# only ci.yml's build receives them), so a Cloudflare-built preview cannot sign in or load
# the course. This workflow builds a branch the way the live site is built, with the real
# keys, and publishes it to a PREVIEW address:
#
#     https://<branch>.nasa-hrvatska-v2.pages.dev      (slashes in the branch become dashes)
#
# It runs only for branches named preview/**, so it never competes with ci.yml (which runs on
# master and on pull requests) and runs no tests. It can NEVER publish to production: the
# Pages production branch is master, and the first step refuses that name.

on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and publish a preview copy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refuse to publish anything that could be production
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "PREVIEW_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_NAME" = "master" ] || [ "$BRANCH" = "master" ]; then
            echo "::error::The preview workflow never runs for master."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with the real Firebase keys
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_SENTRY_DSN: ''

      # Cloudflare keeps separate settings for production and preview. The preview side has no
      # Firebase project id, so every course request answers "server_misconfigured". This sets it
      # for PREVIEW ONLY (--env preview), and BEFORE the publish, because a secret reaches the
      # server code through a new deployment, not the running one. The value is piped on stdin
      # and never printed.
      - name: Give the preview server the Firebase project id
        run: |
          set -euo pipefail
          VALUE=$(printf '%s' "$PROJECT_ID" | tr -d '[:space:]')
          if [ -z "$VALUE" ]; then echo "::error::VITE_FIREBASE_PROJECT_ID is empty"; exit 1; fi
          printf '%s' "$VALUE" | npx --yes wrangler@3 pages secret put VITE_FIREBASE_PROJECT_ID \
            --project-name=nasa-hrvatska-v2 --env preview >/dev/null
          echo "Preview server settings updated (name only; value not shown)."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Publish to a preview address
        run: |
          COMMIT_MSG=$(git log -1 --format='%s' | LC_ALL=C tr -cd '[:print:]' | cut -c1-200)
          npx --yes wrangler@3 pages deploy dist \
            --project-name=nasa-hrvatska-v2 \
            --branch="$PREVIEW_BRANCH" \
            --commit-dirty=true \
            --commit-message="Preview: $COMMIT_MSG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Say where the copy is
        run: |
          echo "Preview copy at https://${PREVIEW_BRANCH}.nasa-hrvatska-v2.pages.dev"
