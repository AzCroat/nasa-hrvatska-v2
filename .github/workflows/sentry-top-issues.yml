# Sentry — top unresolved issues, ranked by event count.
#
# WHY THIS EXISTS (2026-09-11). Every real defect found in the 2026-09-10 audio
# and feedback work came from a Sentry event or an owner field report; none
# came from reading code. A route sweep of all 421 screens found ZERO crashes,
# which is the useful negative result: the remaining P0/P1 issues are silent
# wrongness, and silent wrongness leaves its only trace in Sentry.
#
# The credential to read that already lives in CI (ai-usage-stats.yml uses it
# for release health), so the list was reachable all along — it was just never
# asked for. This turns "paste me the top 20" into a button, and the report is
# re-runnable rather than a one-off hand-copy that goes stale.
#
# READ-ONLY. It lists issues; it never resolves, assigns, deletes or mutates.
#
# THE FIRST VERSION OF THIS FILE REPORTED SUCCESS ON A 403, and both halves of
# that are worth keeping. `curl -sfS … | jq` under a bare `set -e`: `-f`
# THREW THE RESPONSE BODY AWAY (so Sentry's own one-line reason never
# printed — the `ttsFetch` returns-null shape, where a response that arrived
# is indistinguishable from one that did not), and `set -e` does not fail a
# step on a non-final pipeline stage, so the run went GREEN with no list in
# it. A report that cannot fail is not a report. Hence `pipefail`, an
# explicit status check on every call, and the body kept and read.
name: Sentry Top Issues

# TRIGGERS, AND WHY THERE ARE THREE (2026-09-11).
#
# `workflow_dispatch` from the API started coming back `action_required` —
# queued, zero jobs, awaiting a human approval that only the repo UI can give.
# Every API route out of that is closed: the approve endpoint is for fork PRs
# only, `rerun` answers "cannot be retried through the API", and
# `repository_dispatch` is refused by this session's proxy. PUSH-triggered runs
# are NOT gated, which is the asymmetry these triggers exploit — a report that
# can only be produced by asking the owner to click is a report that does not
# get produced.
#
# `push` on master makes every merge print a fresh triage, which is also when
# it is most useful. `schedule` makes it a standing report rather than a button
# someone must remember — the same posture as push-health and backup-health.
# `workflow_dispatch` stays for on-demand runs with a custom window.
#
# THE EXIT CODE DIFFERS BY EVENT, deliberately. On dispatch, an unreadable
# issue stream is the whole point of the run and must go RED. On push it is
# informational riding along with a deploy, so it warns and exits 0 — a
# telemetry read has no business turning a green deploy red.
on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Stats period (e.g. 24h, 14d, 90d)'
        required: false
        default: '14d'
      limit:
        description: 'How many issues to list'
        required: false
        default: '20'
  push:
    branches: [master]
  schedule:
    # 07:10 UTC daily — offset off the hour so it does not pile onto the
    # push-health (07:30) and backup-health (08:30) sweeps.
    - cron: '10 7 * * *'

permissions:
  contents: read

jobs:
  top-issues:
    runs-on: ubuntu-latest
    steps:
      - name: List unresolved issues by event count
        env:
          # Bound through env, never argv: this repo is public and a token on a
          # command line reaches the process table and any `set -x` output.
          # ISSUE READS NEED A SCOPE THE SOURCE-MAP TOKEN DOES NOT HAVE.
          # SENTRY_AUTH_TOKEN is shared with verify-sentry-sourcemaps.yml and
          # ai-usage-stats.yml, which need `project:releases` / `project:write`
          # to upload artifact bundles. REPLACING it with an issues-scoped
          # token would break source-map upload silently — a thing nobody
          # notices until the next stack trace is unreadable, months later.
          # So the issues token is a SEPARATE, OPTIONAL secret and this is the
          # only consumer of it; absent, the shared one is tried and the run
          # says exactly what to add. Additive, and nothing that works today
          # can be broken by granting it.
          SENTRY_ISSUES_TOKEN: ${{ secrets.SENTRY_ISSUES_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # NO `toJSON(secrets)` HERE, DELIBERATELY (removed 2026-09-11).
          # It was added to answer one question — "which secret NAMES can
          # Actions see" — and it answered it: SENTRY_ISSUES_TOKEN was in no
          # store this job can read. Reading the ENTIRE secrets context is a
          # textbook exfiltration shape, it is the most likely reason this
          # workflow (alone among the repo's workflows, on the same push)
          # started coming back `action_required`, and it has no business
          # living permanently in a PUBLIC repo. A diagnostic that has served
          # its purpose is debt, not coverage.
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # `inputs` is empty on push/schedule, so the defaults live here too.
          PERIOD: ${{ inputs.period || '14d' }}
          LIMIT: ${{ inputs.limit || '20' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu -o pipefail
          # No `set -x` anywhere in this step — it would echo the token.
          # `${X:-}` because `set -u` would otherwise abort on the unset
          # optional secret before the missing-secret message can be printed.
          TOKEN=$(printf '%s' "${SENTRY_ISSUES_TOKEN:-}" | tr -d '[:space:]')
          TOKEN_NAME=SENTRY_ISSUES_TOKEN
          # THE FALLBACK MUST NOT BE SILENT. It was, and that is how a run came
          # to tell the owner to add a secret they had just added.
          ISSUES_HINT=""
          if [ -z "$TOKEN" ]; then
            TOKEN=$(printf '%s' "${SENTRY_AUTH_TOKEN:-}" | tr -d '[:space:]')
            TOKEN_NAME=SENTRY_AUTH_TOKEN
            echo "note: SENTRY_ISSUES_TOKEN is not visible to this job — falling back to SENTRY_AUTH_TOKEN."
            ISSUES_HINT="SENTRY_ISSUES_TOKEN is not readable by Actions. It must be a repository ACTIONS secret — not Dependabot, not Codespaces (separate stores), not an Environment secret (this job declares no environment)."
            echo "note: $ISSUES_HINT"
          fi
          ORG=$(printf '%s' "${SENTRY_ORG}" | tr -d '[:space:]')
          PROJ=$(printf '%s' "${SENTRY_PROJECT}" | tr -d '[:space:]')

          # ABSENT IS A CLEAR MESSAGE, NOT A CONFUSING 404. Same contract the
          # secret-install steps use: say which name is missing, by NAME.
          MISSING=""
          [ -n "$TOKEN" ] || MISSING="$MISSING SENTRY_AUTH_TOKEN"
          [ -n "$ORG" ] || MISSING="$MISSING SENTRY_ORG"
          [ -n "$PROJ" ] || MISSING="$MISSING SENTRY_PROJECT"
          if [ -n "$MISSING" ]; then
            echo "::error title=Sentry secrets missing::Set these repo secrets:$MISSING"
            exit 1
          fi

          BODY=$(mktemp)
          # Body KEPT on every status, so the failure can name itself. Sentry
          # answers a scope refusal with `{"detail": "…"}` — one sentence that
          # says which of "bad token", "wrong org", "missing scope" it is.
          # Deliberately no `-f`: that discards exactly that sentence.
          call() {
            url="$1"; shift
            curl -sS -o "$BODY" -w '%{http_code}' -G "$url" \
              -H "Authorization: Bearer $TOKEN" "$@" || echo 000
          }
          # Names and statuses only — never the org slug, never the token.
          # `|| true` is load-bearing: jq exits 5 when $BODY holds an array
          # (a list endpoint) rather than an object, and a failing command
          # substitution inside an ASSIGNMENT aborts the script under `set -e`
          # — silently, before anything is printed. Found by dry-run, not by
          # reading: the probe below leaves $BODY holding a list.
          detail() { jq -r '.detail // .error // empty' "$BODY" 2>/dev/null | head -c 200 || true; }

          # The project id, which is also the reachability probe: this is the
          # exact call ai-usage-stats.yml makes, so a failure HERE says the
          # credential itself is the problem rather than the issues scope.
          ST=$(call "https://sentry.io/api/0/organizations/$ORG/projects/")
          if [ "$ST" != "200" ]; then
            echo "::error title=Sentry unreachable::GET /organizations/<org>/projects/ returned $ST — $(detail)"
            exit 1
          fi
          PROJ_ID=$(jq -r --arg p "$PROJ" '.[] | select(.slug == $p) | .id' "$BODY" | head -n1)
          if [ -z "$PROJ_ID" ]; then
            echo "::error title=Sentry project not visible::The token can list the org but not the project named by SENTRY_PROJECT."
            exit 1
          fi

          # INGESTION HEALTH — added 2026-09-12, because "sessions=0" on its own
          # cannot tell "the browser SDK is not delivering" from "my query is
          # wrong", and the code says sessions SHOULD flow: the SDK's own
          # defaults carry browserSessionIntegration, an `integrations` ARRAY
          # merges with those defaults rather than replacing them, `beforeSend`
          # only filters ERROR events, and nothing sets autoSessionTracking:
          # false, a tunnel or a custom transport. Reading the project itself
          # settles it — and it is an endpoint this token already reaches.
          #
          # `firstEvent` and `hasSessions` are ABSENT-aware on purpose: a field
          # the serializer does not return must read "absent", never "false".
          # Reporting "no sessions" for a field that was never there is the
          # fabricated-measurement failure this repo keeps writing down.
          echo "── Ingestion health ──"
          ST=$(call "https://sentry.io/api/0/projects/$ORG/$PROJ/")
          if [ "$ST" = "200" ]; then
            jq -r '"  platform=\(.platform // "-")  firstEvent=\(.firstEvent // "never")  hasSessions=\(if has("hasSessions") then .hasSessions else "absent" end)  hasMinifiedStackTrace=\(if has("hasMinifiedStackTrace") then .hasMinifiedStackTrace else "absent" end)"' "$BODY" 2>/dev/null || echo "  (project detail did not parse)"
          else
            echo "  project detail unavailable: $ST ($(detail))"
          fi
          # A second sessions read with NO groupBy over a much longer window.
          #
          # `interval` IS REQUIRED AND ITS ABSENCE IS NOT AN ABSENCE OF DATA.
          # Without it this read answered `400 Your interval and date range
          # would create too many results`, and the 14d read answered 200 with
          # an EMPTY groups array — which I read, and reported to the owner
          # repeatedly, as "zero sessions in 14 days". It was never that:
          # `hasSessions=true` on the project says Sentry has session data and
          # always did. A malformed query that returns empty is indistinguishable
          # from an empty result unless you ask something that can only answer
          # yes or no — which is exactly what the project field did.
          ST=$(call "https://sentry.io/api/0/organizations/$ORG/sessions/" \
            --data-urlencode "project=$PROJ_ID" \
            --data-urlencode "field=sum(session)" \
            --data-urlencode "interval=1d" \
            --data-urlencode "statsPeriod=90d")
          if [ "$ST" = "200" ]; then
            # `// 0` ON AN EMPTY `groups` ARRAY IS THE SAME LIE ONE LEVEL
            # DOWN. With `interval` fixed this read now answers 200, and
            # `.groups[0]...  // 0` renders NO ROWS as `0` — exactly the
            # conflation the whole block above exists to end. Row count first,
            # then the total, and NO ROWS says so in words.
            jq -r 'if (.groups | length) == 0
                     then "  90d: the query returned NO ROWS — undetermined, not zero"
                     else "  sessions_90d_ungrouped=\(.groups[0].totals["sum(session)"] // 0)  rows=\(.groups | length)"
                   end' "$BODY" 2>/dev/null || echo "  (90d sessions did not parse)"
          else
            echo "  90d sessions unavailable: $ST ($(detail))"
          fi
          echo

          # HOW BAD IS IT, BEFORE WHAT IS IT. Session health is the denominator
          # any issue count needs — "412 events" means one thing against 400
          # sessions and another against 40,000 — and it reads through
          # release-health scope, which is a DIFFERENT permission from issue
          # reads. So it is printed first and unconditionally: when the issue
          # stream is refused this is what the run still knows, instead of the
          # report being a dead end.
          echo "── Session health, last $PERIOD ──"
          ST=$(call "https://sentry.io/api/0/organizations/$ORG/sessions/" \
            --data-urlencode "project=$PROJ_ID" \
            --data-urlencode "field=sum(session)" \
            --data-urlencode "field=count_unique(user)" \
            --data-urlencode "groupBy=session.status" \
            --data-urlencode "interval=1d" \
            --data-urlencode "statsPeriod=$PERIOD")
          if [ "$ST" = "200" ]; then
            jq -r '
              # `add` over an empty list is null, and a window with no
              # sessions is a real case (a fresh project, a short period).
              # Without the `// {}` this threw, and under pipefail that takes
              # the whole report red for a project that is simply quiet.
              ([.groups[] | {(.by["session.status"]): .totals["sum(session)"]}] | add // {}) as $s
              | ($s | to_entries | map(.value) | add // 0) as $tot
              | ($s.crashed // 0) as $cr
              | ($s.errored // 0) as $er
              | (.groups | length) as $rows
              | "sessions=\($tot)  healthy=\($s.healthy // 0)  errored=\($er)  crashed=\($cr)  abnormal=\($s.abnormal // 0)  rows=\($rows)",
                (if $tot > 0
                   then "crash_free=\((100 - ($cr * 100 / $tot)) * 100 | round / 100)%  error_free=\((100 - (($cr + $er) * 100 / $tot)) * 100 | round / 100)%"
                 elif $rows == 0
                   then "the query returned NO ROWS — undetermined, not zero"
                   else "a real zero: \($rows) row(s) returned, every status at 0" end)
            ' "$BODY"
          else
            echo "session health unavailable: $ST ($(detail))"
          fi
          echo

          # `sort=freq` is the ranking that answers "what is hurting the most
          # people", which is what a P0/P1 triage needs — not the newest.
          #
          # ORG-SCOPED FIRST. The legacy project-scoped route
          # (/projects/<org>/<proj>/issues/) answered 403 for this token on
          # 2026-09-11; the org issue stream is the current one and is what
          # the UI itself calls. The legacy route is kept as a fallback rather
          # than deleted — an older token may be scoped the other way round,
          # and trying both costs one request on a path that already failed.
          ST=$(call "https://sentry.io/api/0/organizations/$ORG/issues/" \
            --data-urlencode "query=is:unresolved" \
            --data-urlencode "project=$PROJ_ID" \
            --data-urlencode "statsPeriod=$PERIOD" \
            --data-urlencode "sort=freq" \
            --data-urlencode "limit=$LIMIT")
          if [ "$ST" != "200" ]; then
            FIRST="$ST ($(detail))"
            ST=$(call "https://sentry.io/api/0/projects/$ORG/$PROJ/issues/" \
              --data-urlencode "query=is:unresolved" \
              --data-urlencode "statsPeriod=$PERIOD" \
              --data-urlencode "sort=freq" \
              --data-urlencode "limit=$LIMIT")
            if [ "$ST" != "200" ]; then
              # The probe below reuses $BODY, so the reason for THIS refusal
              # has to be taken now. Without it the final message described
              # whichever endpoint the probe happened to touch last.
              SECOND="$ST ($(detail))"

              # CAPABILITY PROBE (2026-09-11). Four credential changes in a
              # row each ended at this same sentence, because "403 You do not
              # have permission" is ALL Sentry says for a missing scope, a
              # project the token's user cannot see, and an org policy alike.
              # Asking for a fifth change while the report still cannot tell
              # those apart is the wrong-but-plausible-hypothesis loop the
              # audio work cost four rounds to learn.
              #
              # So: walk the endpoints and print a status per path. Statuses
              # and fixed path shapes only — the org and project slugs are
              # substituted out, and no body is printed beyond `detail`.
              # `/api/0/auth/` is the discriminator that matters: it answers
              # 200 for a USER auth token and 401/403 for an ORGANIZATION auth
              # token, whose scope set is fixed and never includes event:read.
              # That is the one fact no amount of re-pasting can reveal.
              echo "── What this token can reach ──"
              probe() {
                label="$1"; shift
                st=$(call "$@")
                printf '  %-46s %s%s\n' "$label" "$st" \
                  "$([ "$st" = "200" ] || printf ' — %s' "$(detail)")"
              }
              probe "GET /auth/  (200 = user token, 401/403 = org token)" \
                "https://sentry.io/api/0/auth/"

              # THE SCOPES THE TOKEN ACTUALLY CARRIES (2026-09-12).
              #
              # "403 You do not have permission" is all Sentry says for a
              # missing scope, and after a scope is ADDED it is also all it says
              # if the GitHub secret still holds a DIFFERENT token — the two are
              # indistinguishable from the refusal alone, which is the same
              # narrower-question trap as the sessions `interval` and the
              # AZURE_TTS_KEY deploy log. `/auth/` answers it directly: it
              # returns the authenticated token's own scope list, so the report
              # can say whether `event:read` is present on the credential THIS
              # JOB IS USING rather than inferring it from a refusal.
              #
              # Scope NAMES only. The token is never printed — same rule as
              # everywhere else in this file, and `$BODY` is not dumped.
              ST=$(call "https://sentry.io/api/0/auth/")
              if [ "$ST" = "200" ]; then
                SCOPES=$(jq -r '(.scopes // []) | join(" ")' "$BODY" 2>/dev/null || true)
                printf '  %-46s %s\n' "token scopes" "${SCOPES:-(none reported)}"
                case " $SCOPES " in
                  *" event:read "*)
                    echo "  → event:read IS present; a 403 above is NOT a scope problem." ;;
                  *)
                    echo "  → event:read is ABSENT from the token this job used." ;;
                esac
              else
                echo "  token scopes unavailable: $ST ($(detail))"
              fi
              probe "GET /organizations/<org>/" \
                "https://sentry.io/api/0/organizations/$ORG/"
              probe "GET /organizations/<org>/projects/" \
                "https://sentry.io/api/0/organizations/$ORG/projects/"
              probe "GET /projects/<org>/<proj>/" \
                "https://sentry.io/api/0/projects/$ORG/$PROJ/"
              probe "GET /organizations/<org>/issues/  (no project filter)" \
                "https://sentry.io/api/0/organizations/$ORG/issues/" \
                --data-urlencode "statsPeriod=1h" --data-urlencode "limit=1"
              probe "GET /projects/<org>/<proj>/issues/" \
                "https://sentry.io/api/0/projects/$ORG/$PROJ/issues/" \
                --data-urlencode "limit=1"
              probe "GET /organizations/<org>/releases/" \
                "https://sentry.io/api/0/organizations/$ORG/releases/" \
                --data-urlencode "per_page=1"
              echo

              # NAME THE REMEDY, not just the symptom. The project resolved a
              # moment ago, so org slug, project slug and credential are all
              # fine and only the scope is missing — say which secret to add
              # rather than leaving a reader to guess between three causes.
              # The remedy depends on WHICH token was used. Telling someone to
              # "add SENTRY_ISSUES_TOKEN" when they just added it — and the job
              # simply cannot see it — is the report lying about its own cause.
              if [ -n "$ISSUES_HINT" ]; then
                REMEDY="$ISSUES_HINT"
              else
                REMEDY="SENTRY_ISSUES_TOKEN was used and still cannot read issues, so the TOKEN ITSELF lacks event:read — regenerate it in Sentry with event:read (plus project:read, org:read)."
              fi
              MSG="org stream $FIRST; project stream $SECOND. $TOKEN_NAME reaches the org and resolved the project, so this is a SCOPE, not a slug or a bad token: issue reads need event:read. $REMEDY"
              # RED on dispatch (the run exists to produce the list); a WARNING
              # when riding along with a push or the daily schedule, because a
              # telemetry read must never turn a green deploy red.
              if [ "${EVENT:-workflow_dispatch}" = "workflow_dispatch" ]; then
                echo "::error title=Sentry issues unreadable::$MSG"
                exit 1
              fi
              echo "::warning title=Sentry issues unreadable::$MSG"
              exit 0
            fi
          fi

          # The header sits AFTER the last thing that can fail. Printed before,
          # a refused run announced "Top 20 unresolved issues" and then an
          # error — a heading for a list that does not exist.
          echo "── Top $LIMIT unresolved issues, last $PERIOD, by event count ──"
          echo

          jq -r '
              if length == 0 then
                "No unresolved issues in this window."
              else
                .[] | [
                  "events=" + (.count|tostring),
                  "users=" + ((.userCount // 0)|tostring),
                  "level=" + (.level // "-"),
                  "lastSeen=" + (.lastSeen // "-"),
                  "",
                  "  " + (.metadata.type // .title // "(untitled)"),
                  "  " + ((.metadata.value // "") | .[0:160]),
                  "  culprit: " + (.culprit // "-"),
                  "  " + (.permalink // "-"),
                  ""
                ] | join("\n")
              end
            ' "$BODY"
