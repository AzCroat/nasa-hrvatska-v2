name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  # Manual lever (2026-08-26). Twice now a master run has been created and then
  # never dispatched a single job — 2026-07-27 with a wedged in-progress job,
  # and again today with a repo-wide dispatch stall. In BOTH cases the API had
  # nothing to offer: cancel returns 409 "Cannot cancel a workflow run that has
  # not been queued yet", rerun returns 403 "This workflow is already running".
  # With only push and pull_request triggers, the sole way to free the
  # `CI-refs/heads/master` concurrency group was to push another commit to
  # master — i.e. to fake a change to production in order to retry a deploy.
  # This gives the run an honest retry button instead.
  #
  # A dispatch on master DEPLOYS, exactly as the push it stands in for does —
  # see build-deploy's DEPLOY gate. It did not, at first: the deploy steps were
  # gated on `event_name == 'push'`, so the first real use of this lever (the
  # #549 merge, 2026-08-26) produced a fully green run that shipped nothing and
  # cancelled the push run it replaced, costing a deploy cycle. A retry button
  # that cannot retry the thing that failed is not a retry button.
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a new push arrives.
# Prevents E2E suites from piling up during rapid development (e.g. 6 queued runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: TypeScript + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Content endpoint tests import ETAGS from _etags.js (auto-generated, gitignored).
      # Generator runs as prebuild during npm run build, but this job doesn't build —
      # invoke directly so the file exists before vitest imports the endpoints.
      - name: Generate content ETags (required by endpoint tests)
        run: node scripts/generate-content-etags.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --run

  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts: pure-JS toolchain below (eslint/tsc/prettier/madge/npm audit)
      # doesn't need native binaries from esbuild/sharp/better-sqlite3 postinstalls.
      # Reduces supply-chain blast radius if a transitive dep is compromised.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Dependency security audit
        run: npm audit --audit-level=high --omit=dev

      - name: TypeScript check
        run: npm run typecheck

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}" "functions/**/*.js"

      - name: Circular dependency check
        run: npm run check:circular

      # The Croatian content lint existed as an npm script and was run by hand,
      # which means it was run when someone remembered — the same "guard that
      # never fires" class this repo keeps getting bitten by. It screens every
      # authored content file for encoding bleed (Cyrillic homoglyphs, soft
      # hyphens) and for Serbian forms, using the same rules the live AI output
      # sweep uses. Cheap, deterministic, no network.
      - name: Croatian content lint
        run: npm run lint:croatian

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    # 2026-07-27: added after a wedged runner left this job "in_progress" for
    # 35+ minutes on a step that normally finishes in ~5. With no
    # timeout-minutes it inherited GitHub's 360-minute default, so it could not
    # fail fast and could not self-resolve: cancel_workflow_run returned 202
    # without tearing the job down, and rerun kept returning "This workflow is
    # already running". The run had to be freed by closing/reopening the PR to
    # trip the concurrency group. Meanwhile the PR sat at 13/14 checks, which is
    # exactly the state that tempts someone into merging on an incomplete
    # signal.
    #
    # This TIGHTENS the gate, it does not relax it — an unbounded job is not a
    # stricter check, it is one that can never report. Headroom is deliberate:
    # observed durations are ~4m14s–5m13s, so 20 gives ~4x. That matches the
    # ratio the e2e job already uses (75 for a ~16-minute suite). If the suite
    # legitimately grows past this, raise the number — do not remove it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate content ETags (required by endpoint tests)
        run: node scripts/generate-content-etags.mjs

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 1

  emulator:
    name: Emulator Tests (Firestore)
    runs-on: ubuntu-latest
    # Runs the emulator-backed suites that the default `vitest run` excludes
    # (they need a live Firestore emulator on 127.0.0.1:8080):
    #   - firestore-merge-semantics.test.js — proves set({merge:true}) deep-merge
    #     (guards the 2026-05-28 fbSaveProgress single-write fix, 44e45e1)
    #   - firestore-rules.test.js — security-rules suite (was never CI-gated before)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The Firestore emulator is a JVM process; pin the JDK for reproducibility
      # rather than relying on whatever the runner image ships.
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # firebase-tools is intentionally NOT in package.json — it is large and only
      # this one job needs the `firebase` CLI. Installing it globally here keeps it
      # out of every other job's `npm ci`. Pinned for determinism.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.10.1

      # test:emulator runs BOTH emulator suites (merge-semantics + security-rules)
      # under one emulator boot via vitest.emulator.config.js.
      - name: Firestore emulator suites (merge-semantics + rules)
        run: npm run test:emulator

  e2e:
    name: E2E Tests (Cross-Browser)
    runs-on: ubuntu-latest
    needs: quality
    # 2026-05-22: bumped 45 → 75 — suite has grown substantially since the
    # 17-min historical baseline. Long-term fix is E2E sharding / test pruning.
    timeout-minutes: 75
    # Tests use seedAuth (localStorage injection) + blockFirebase (network abort) fixtures.
    # No live Firebase credentials needed — the app runs in fully hermetic mode.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # 2026-08-19: this install stalled on a GitHub-side download TWICE in one
      # day — once in production-smoke (6h to the default timeout) and once
      # here (75 min to the job cap), where it SKIPPED Build & Deploy and cost
      # a deploy cycle. GitHub Actions has no native step retry, so each
      # attempt is bounded with bash `timeout` and retried once on a stall;
      # the step-level timeout-minutes is the outer bound. Healthy runs take
      # ~2 minutes — everything past that is pure headroom.
      # A timed-out attempt orphans the apt-get child `timeout` doesn't kill,
      # and the orphan keeps holding the apt lock — the retry then dies
      # instantly with "Could not get lock" (seen live, run 32302453122).
      # So between attempts: kill orphaned apt processes and clear their locks.
      - name: Install Playwright browsers (Chrome, Firefox, WebKit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 22
        run: |
          for attempt in 1 2; do
            if timeout 600 npx playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::Playwright install attempt ${attempt} failed or stalled (10-min bound)"
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 -x apt 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
            sudo dpkg --configure -a || true
          done
          echo "::error::Playwright install failed twice — likely an Ubuntu-mirror or GitHub-side outage; re-run the job"
          exit 1

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 22
        run: |
          for attempt in 1 2; do
            if timeout 600 npx playwright install-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::install-deps attempt ${attempt} failed or stalled (10-min bound)"
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 -x apt 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
            sudo dpkg --configure -a || true
          done
          echo "::error::install-deps failed twice — likely an Ubuntu-mirror or GitHub-side outage; re-run the job"
          exit 1

      - name: Build for E2E (with placeholder Firebase config)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'placeholder' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'placeholder.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'placeholder' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'placeholder.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:placeholder' }}
          VITE_SENTRY_DSN: ""

      - name: Run E2E tests — Chrome (full suite)
        run: npx playwright test --project="Desktop Chrome"
        env:
          CI: true

      - name: Run E2E tests — Firefox + WebKit (smoke only)
        # Targeted subset to verify cross-browser compat without exceeding 45-min budget.
        # Full suite × 3 engines ≈ 60 min; smoke-only keeps Firefox+WebKit under 10 min.
        run: |
          npx playwright test \
            --project="Desktop Firefox" \
            --project="Desktop Safari (WebKit)" \
            e2e/navigation.spec.js \
            e2e/auth-edge-cases.spec.js \
            e2e/error-boundary.spec.js
        env:
          CI: true

      - name: Upload E2E report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7

  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # E2E added to the gate (owner decision, 2026-08-18): a red Playwright run
    # now BLOCKS the production deploy. Before this, build-deploy raced e2e —
    # a change that passed unit tests but broke a real user flow deployed to
    # production while E2E was still running. The cost is ~15-35 min added
    # deploy latency (see the e2e job's timeout note); the owner accepted it.
    needs: [quality, test, e2e]
    # ── The deploy gate, defined ONCE ────────────────────────────────────────
    # Every step below that touches Cloudflare reads this one value. It was five
    # copies of `github.event_name == 'push'`; a single expression cannot drift
    # from itself, and there is exactly one place to look to answer "does this
    # run deploy?".
    #
    # THE REF CHECK IS LOAD-BEARING, and is why this is not simply
    # `event_name != 'pull_request'`. `push` only ever fires on master (see the
    # `on:` block), but workflow_dispatch can be started against ANY ref from the
    # Actions UI — without the ref check, dispatching from a feature branch would
    # build that branch and publish it to production under --branch=master. The
    # trigger exists to retry master, not to offer a one-click way to ship
    # unreviewed work.
    #
    # Renders as the STRING 'true'/'false' in env, hence the string comparison.
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The CLIENT half of Sentry is baked into the bundle HERE, at build time.
      # main.tsx guards `Sentry.init` on VITE_SENTRY_DSN being truthy and skips
      # the dynamic import entirely when it is empty — deliberately, so the
      # ~40KB SDK is never parsed without a DSN, but therefore SILENTLY. An
      # unset GitHub secret expands to "" and ships a build with no telemetry at
      # all, with nothing in the log to say so. That is the same shape as the
      # service account that went unset for years; it gets the same warning.
      # (Fails nothing: a missing secret is not something this build can fix.)
      #
      # Tested in the shell rather than a step-level `if`: the `secrets` context
      # is not among those available to `steps.<id>.if`, and this repo has no
      # precedent for it. Binding the secret through `env` and testing it in
      # `run` is the pattern the two install steps below already use, and it is
      # known to work here. Prints the NAME only, never the value.
      - name: Warn if the Sentry DSN is absent
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SENTRY_DSN:-}" ]; then
            echo "::warning title=Sentry DSN not set::VITE_SENTRY_DSN is not a GitHub secret, so main.tsx skips Sentry.init and this build ships with NO browser error telemetry."
          else
            echo "VITE_SENTRY_DSN is set; the browser SDK will initialise."
          fi

      # Absent is a WARNING, not a failure: no code change here can conjure a
      # key, and taking the deploy red for a condition that predates this step
      # would be worse. But it must be SAID — the whole reason both of these
      # went unnoticed is that their consumers treat absence as the graceful
      # path, so nothing anywhere emitted a sound.
      - name: Warn if the analytics keys are absent
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_TURNSTILE_SITEKEY: ${{ secrets.VITE_TURNSTILE_SITEKEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_POSTHOG_KEY:-}" ]; then
            echo "::warning title=PostHog key absent::VITE_POSTHOG_KEY is not a GitHub secret, so initPostHog() stays gated off and this build ships with NO product analytics."
          else
            echo "VITE_POSTHOG_KEY is set; PostHog will initialise."
          fi
          if [ -z "${VITE_FIREBASE_MEASUREMENT_ID:-}" ]; then
            echo "::warning title=Firebase measurementId absent::VITE_FIREBASE_MEASUREMENT_ID is not a GitHub secret, so getAnalytics() is never constructed and every fbLogEvent is a silent no-op."
          else
            echo "VITE_FIREBASE_MEASUREMENT_ID is set; Firebase Analytics will initialise."
          fi
          if [ -z "${VITE_TURNSTILE_SITEKEY:-}" ]; then
            echo "::warning title=Signup bot gate off::VITE_TURNSTILE_SITEKEY is not a GitHub secret, so the Turnstile widget never renders; with TURNSTILE_SECRET_KEY also unset the server verify returns skipped:true. Signup has NO bot check."
          else
            echo "VITE_TURNSTILE_SITEKEY is set; the signup bot gate will render."
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # ── BOTH ANALYTICS PATHS WERE DEAD UNTIL 2026-09-12 ──
          # Read in src/ and passed by NO build step, so both were `undefined`
          # in every shipped bundle, and both consumers guard on them — so the
          # features were silently ABSENT rather than broken:
          #   initPostHog()  `if (VITE_POSTHOG_KEY && PROD)` → never true; no
          #     posthog chunk was even emitted, exactly as vendor-sentry was
          #     not emitted when the DSN was empty.
          #   firebase.ts    `if (FIREBASE_CONFIG.measurementId)` → never true,
          #     so getAnalytics() was never constructed and every fbLogEvent
          #     was a no-op.
          # `viteEnvReachesBuild.test.ts` now fails the build if any VITE_ var
          # read in src/ is missing from this list.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # The signup bot gate. Read via OPTIONAL CHAINING
          # (`import.meta.env?.VITE_TURNSTILE_SITEKEY`), which is how it escaped
          # the first version of viteEnvReachesBuild.test.ts. Unset, the widget
          # never renders AND /api/turnstile/verify returns {ok:true,skipped:true}
          # — both halves feature-flagged off, so signup has no bot check at all.
          VITE_TURNSTILE_SITEKEY: ${{ secrets.VITE_TURNSTILE_SITEKEY }}

      # ── The deploy must SHIP the telemetry it was built with (2026-09-04) ──
      #
      # WHY THIS EXISTS: with the DSN secret set, valid, and installed for the
      # relay, a live browser still showed `window.__nhSentry === undefined` and
      # made no request for the SDK chunk at all — meaning
      # `if (import.meta.env.VITE_SENTRY_DSN)` was FALSY at runtime in whatever
      # bundle was being served. Every layer either side of that was verifiable
      # (the secret from CI's log, the CSP from _headers, the init config from
      # source) and the one link in the middle — did the DSN actually reach the
      # artifact we uploaded — was the one nobody could see without opening
      # DevTools on production and reading it out by hand.
      #
      # So this asserts the OUTPUT, not the input. The Build step above proves
      # the variable was PASSED; only reading dist/ proves it was BAKED IN. That
      # distinction is the whole finding: `main.tsx` skips Sentry.init silently
      # on an empty DSN, so a bundle built without it is indistinguishable from
      # a healthy one until someone notices weeks of silence and cannot tell
      # whether it means "no errors" or "no telemetry".
      #
      # ABSENT is a warning (the Build step already said so, and no code change
      # here can fix it). PRESENT-BUT-NOT-SHIPPED is a FAILURE: we hold a DSN,
      # we passed it to the build, and the artifact does not carry it — that is
      # a broken build pipeline, and shipping it would restore the exact silent
      # blackout this was written for. Same contract as the install steps below.
      #
      # Secret hygiene (public repo): the DSN is read from process.env, never
      # argv, and NOTHING here prints it — only counts and booleans. The bundle
      # ships the DSN to every browser, but a CI log is a different audience
      # with a different retention, so it stays out of both.
      - name: Verify the built bundle carries the Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_DSN:-}" ]; then
            echo "::warning title=Sentry DSN not set::Skipping the bundle check — there is no DSN to look for. The build step already warned that this artifact ships with no browser telemetry."
            exit 0
          fi
          node --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs";
            const dsn = process.env.SENTRY_DSN || "";
            const dir = "dist/assets";
            let files;
            try {
              files = readdirSync(dir).filter((f) => f.endsWith(".js"));
            } catch {
              console.error("dist/assets not found — did the build actually run?");
              process.exit(1);
            }
            const carriesDsn = files.some((f) => readFileSync(dir + "/" + f, "utf8").includes(dsn));
            const hasSdkChunk = files.some((f) => /vendor-sentry/.test(f));
            console.log("bundle js files scanned:  " + files.length);
            console.log("DSN inlined into bundle:  " + carriesDsn);
            console.log("Sentry SDK chunk emitted: " + hasSdkChunk);
            if (!carriesDsn) {
              console.error(
                "The DSN is set in CI but did NOT reach the built bundle. main.tsx guards " +
                  "Sentry.init on it, so this artifact would ship with NO browser error " +
                  "telemetry and would look exactly like a healthy one."
              );
              process.exit(1);
            }
            if (!hasSdkChunk) {
              console.error(
                "No vendor-sentry chunk was emitted, so the lazy import in main.tsx has no " +
                  "target and Sentry can never initialise."
              );
              process.exit(1);
            }

            // ── The RELEASE must reach the bundle too (2026-09-12) ──
            //
            // A DSN and an SDK chunk are not enough. Vite `define` substitutes
            // the bare IDENTIFIER `__BUILD_ID__`; main.tsx used to read
            // `globalThis.__BUILD_ID__`, a member expression that is NOT
            // substituted and is permanently undefined. A Sentry client with no
            // release DISCARDS every session inside sendSession before an
            // envelope is built, and `isStaleBuild` treats a null running build
            // as "cannot conclude" and never reloads. So the bundle looked
            // perfectly healthy — DSN present, SDK present — while shipping zero
            // session telemetry and a dead auto-update, for the life of the code.
            //
            // version.json is written by vite.config from the SAME BUILD_ID, so
            // its value appearing in the bundle is exactly the proof that the
            // substitution happened. Derived, not restated: no literal here.
            const deployed = JSON.parse(readFileSync("dist/version.json", "utf8"))?.v;
            if (!deployed) {
              console.error("dist/version.json carries no build id — vite.config did not write it.");
              process.exit(1);
            }
            const carriesRelease = files.some((f) =>
              readFileSync(dir + "/" + f, "utf8").includes(`release:"${deployed}"`)
            );
            console.log("release baked into bundle: " + carriesRelease);
            if (!carriesRelease) {
              console.error(
                "The build id in dist/version.json does not appear as the Sentry `release` in " +
                  "any bundle chunk. Read `__BUILD_ID__` as a BARE identifier — a member " +
                  "expression survives `define` untouched, and a release-less client silently " +
                  "discards every session."
              );
              process.exit(1);
            }
          '

      - name: Bundle size check
        run: npm run size

      - name: Lighthouse CI
        run: npx lhci autorun
        continue-on-error: true  # NO_FCP is a transient headless-Chrome infra flake — never blocks deploy
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Provision Cloudflare resources (idempotent)
        if: env.DEPLOY == 'true'
        run: node scripts/setup-cf-resources.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Managed cron credential, half 1 of 2 (Pages) ─────────────────────────
      # The scheduled Worker authenticates to /api/streak-push and
      # /api/backup-progress with a shared secret that used to be typed by hand
      # into TWO places with nothing keeping them equal. On 2026-08-23 they
      # drifted: 79 consecutive hourly runs, 0 reminders delivered, every attempt
      # `unauthorized`, and the weekly Firestore backup down beside it.
      #
      # CI now derives the value from a credential it already holds and writes
      # BOTH sides itself, so they cannot disagree. Same derivation and the same
      # public label as calibration.yml's self-provisioned secret — nobody ever
      # pastes anything, and rotating the Cloudflare token re-syncs both halves
      # on the next deploy. The owner's CRON_SECRET is never touched and stays
      # accepted, so this can only ADD a working credential.
      #
      # MUST run BEFORE the Pages deploy: a Pages secret reaches Functions
      # through a new deployment, not the running one.
      - name: Install managed cron secret (Pages)
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "nh-cron-v1" \
            | openssl dgst -sha256 -hmac "${CLOUDFLARE_API_TOKEN}" -r | cut -d' ' -f1)
          echo "::add-mask::${TOKEN}"
          printf '%s' "${TOKEN}" | npx --yes wrangler@3 pages secret put MANAGED_CRON_SECRET \
            --project-name nasa-hrvatska-v2 >/dev/null
          echo "MANAGED_CRON_SECRET installed on the Pages project"

      # ── Firebase service account (Pages) ─────────────────────────────────────
      # FIREBASE_SERVICE_ACCOUNT_JSON has never been set on the Pages project.
      # /api/backup-health's first run (2026-08-26) reported fifteen consecutive
      # config failures: the weekly Firestore backup has NEVER produced a
      # restorable snapshot. The same value also gates /api/delete-account, which
      # fails CLOSED — so a learner asking to delete their account currently gets
      # a 500 and keeps it. And /api/backfill, and the Google TTS fallback.
      #
      # It was treated as a dashboard chore nobody did for years. It is not: this
      # is the same install path the managed cron secret uses, and CI is the one
      # place that writes Pages secrets reliably. Adding it here means the value
      # is set once as a GitHub secret and re-applied on every deploy, and
      # rotating it is a secret update rather than a dashboard visit.
      #
      # UNLIKE the cron secret, CI cannot DERIVE this one — it is a real Google
      # credential. So the step must tolerate its absence: this repo's whole
      # deploy would otherwise go red on a condition that predates the change and
      # that no code can fix. Absent is a loud WARNING (visible in the run
      # summary and in setup-cf-resources.mjs's post-deploy check), never a
      # silent skip — a guard that says nothing is the failure mode this repo
      # keeps rediscovering.
      #
      # PRESENT but uninstallable IS a failure, deliberately not
      # continue-on-error: if we hold the credential and cannot write it, the
      # Functions keep running on a stale or missing value, which is exactly the
      # drift the cron work was done to end.
      #
      # SECRET HYGIENE (this repo is public): the value never reaches argv, a
      # log line, or an error message. It is piped from the environment on
      # stdin, and the shape check below prints only FIELD NAMES and booleans —
      # names never values, the same rule the backup failure codes follow.
      # `set -x` is never enabled in this step.
      #
      # MUST run BEFORE the Pages deploy, for the same reason as the cron half:
      # a Pages secret reaches Functions through a new deployment, not the
      # running one.
      - name: Install Firebase service account (Pages)
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning title=Firebase service account not set::FIREBASE_SERVICE_ACCOUNT_JSON is not a GitHub secret, so it cannot be installed on the Pages project. The weekly Firestore backup produces no restorable snapshot and /api/delete-account fails closed until it is set."
            exit 0
          fi
          # Shape check before install: a malformed paste installed silently is
          # worse than nothing — it turns a clear "missing" into an obscure
          # runtime failure next Monday. node reads the value from the
          # environment, never from argv, and reports only which keys are absent.
          node --input-type=module -e '
            const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "";
            let sa;
            try { sa = JSON.parse(raw); }
            catch { console.error("FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON"); process.exit(1); }
            const missing = ["client_email", "private_key", "project_id"].filter((k) => !sa?.[k]);
            if (missing.length) {
              console.error("service account JSON is missing required field(s): " + missing.join(", "));
              process.exit(1);
            }
            if (sa.type && sa.type !== "service_account") {
              console.error("credential type is " + sa.type + ", expected service_account");
              process.exit(1);
            }
            console.log("service account JSON parsed; required fields present");
          '
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" \
            | npx --yes wrangler@3 pages secret put FIREBASE_SERVICE_ACCOUNT_JSON \
              --project-name nasa-hrvatska-v2 >/dev/null
          echo "FIREBASE_SERVICE_ACCOUNT_JSON installed on the Pages project"

      # ── Sentry DSN, server half (2026-09-04) ─────────────────────────────
      #
      # THE DEFECT THIS CLOSES: /api/report-error reads `env.SENTRY_DSN`, and
      # nothing anywhere installed a variable by that name. sync-cf-pages-env.yml
      # pushed `VITE_SENTRY_DSN` instead — a different key — so the relay's
      # `if (env.SENTRY_DSN)` was permanently false and it has never forwarded a
      # single event. It still console.errors to the Cloudflare tail, which is
      # what made the endpoint look like it was working. Found from the outside:
      # the Sentry project had received nothing at all.
      #
      # The VITE_-prefixed push was inert besides. The client bundle is built
      # HERE (the Build step, from the GitHub secret) and shipped to Pages as
      # prebuilt static assets — Cloudflare never rebuilds it — so a VITE_ Pages
      # secret can never reach the browser. The two halves of Sentry come from
      # one GitHub secret by two different routes: the client baked in at build
      # time, the server installed onto Pages here.
      #
      # Same install contract as the cron secret and the service account above:
      # ABSENT emits a ::warning and exits 0 (a condition no code change can fix
      # should not take the whole deploy red), PRESENT-but-uninstallable FAILS
      # (holding a credential we cannot write is the drift that work ended).
      # Secret hygiene: piped on stdin, never argv, and no diagnostic prints the
      # value — only its name and a length-independent boolean.
      #
      # MUST run BEFORE `pages deploy`: a Pages secret reaches Functions through
      # a NEW deployment, not the running one. Pinned by sentryDsnInstall.test.js.
      - name: Install Sentry DSN (Pages)
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_DSN:-}" ]; then
            echo "::warning title=Sentry DSN not set::VITE_SENTRY_DSN is not a GitHub secret. The browser SDK is skipped at build time (main.tsx guards on it) AND /api/report-error cannot forward, so the app reports no errors anywhere until it is set."
            exit 0
          fi
          # Shape check before install. A DSN that is not a URL installs happily
          # and then fails inside forwardToSentry's `new URL(dsn)` at request
          # time — the same "obscure runtime failure later" the service-account
          # check exists to prevent. Reads from the environment, never argv, and
          # reports only which PART is missing.
          node --input-type=module -e '
            const raw = process.env.SENTRY_DSN || "";
            let u;
            try { u = new URL(raw); }
            catch { console.error("SENTRY_DSN is not a valid URL"); process.exit(1); }
            if (u.protocol !== "https:") {
              console.error("SENTRY_DSN protocol is " + u.protocol + ", expected https:");
              process.exit(1);
            }
            // forwardToSentry derives the public key from the username and the
            // project id from the path; a DSN missing either yields a malformed
            // store URL that fails silently in waitUntil.
            const missing = [];
            if (!u.username) missing.push("public key (the user part)");
            if (!u.pathname || u.pathname === "/") missing.push("project id (the path)");
            if (missing.length) {
              console.error("SENTRY_DSN is missing: " + missing.join(", "));
              process.exit(1);
            }
            console.log("SENTRY_DSN parsed; host, public key and project id present");
          '
          printf '%s' "${SENTRY_DSN}" \
            | npx --yes wrangler@3 pages secret put SENTRY_DSN \
              --project-name nasa-hrvatska-v2 >/dev/null
          echo "SENTRY_DSN installed on the Pages project"

      # ── Azure Speech (TTS) ───────────────────────────────────────────────────
      # Owner report, 2026-09-09: "Audio did not play. Has not once yet." The
      # AI-generated listening screen produced its lesson and its word list on
      # the same tap, so auth, the daily quota and the monthly budget were all
      # healthy — only the TTS backend chain returned nothing.
      #
      # AZURE_TTS_KEY is the FIRST backend in that chain and the only one that
      # is a real Croatian neural voice; without it /api/tts falls through to
      # Google Translate TTS, which answers a consent/token body to datacenter
      # IPs. It was a dashboard-only variable, and this repo has already learned
      # once what that means: FIREBASE_SERVICE_ACCOUNT_JSON had NEVER been set,
      # for years, because it was filed as a dashboard chore while CI had
      # already proven it can write Pages secrets.
      #
      # Same contract as the three install steps above: ABSENT is a warning and
      # exit 0 (it predates this step and no code can fix it), PRESENT but
      # uninstallable FAILS, and it is deliberately not continue-on-error.
      # Secret hygiene as everywhere here: piped on stdin never argv, the
      # checker reads process.env, diagnostics print NAMES only, no `set -x`.
      - name: Install Azure Speech credentials (Pages)
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_TTS_KEY:-}" ]; then
            echo "::warning title=Azure Speech key not set::AZURE_TTS_KEY is not a GitHub secret. /api/tts loses its Croatian neural voice and falls through to keyless fallbacks that a Cloudflare datacenter IP is often refused by, so audio can fail everywhere with no other symptom. Set AZURE_TTS_KEY (and optionally AZURE_TTS_REGION) in GitHub secrets."
            exit 0
          fi
          # Shape check before install: a key with whitespace in it is a paste
          # accident, and installing it converts a clear "missing" into an
          # obscure 401 from Azure at request time. Deliberately loose on
          # length — Azure has shipped both 32-char and 84-char keys and
          # rejecting a valid one would be worse than the gap.
          node --input-type=module -e '
            const k = process.env.AZURE_TTS_KEY || "";
            if (/\s/.test(k)) { console.error("AZURE_TTS_KEY contains whitespace"); process.exit(1); }
            if (k.length < 20) { console.error("AZURE_TTS_KEY is implausibly short"); process.exit(1); }
            const r = process.env.AZURE_TTS_REGION || "";
            if (r && !/^[a-z0-9-]+$/.test(r)) {
              console.error("AZURE_TTS_REGION is not a region slug");
              process.exit(1);
            }
            console.log("AZURE_TTS_KEY shape ok" + (r ? "; region provided" : "; region defaults to westeurope"));
          '
          printf '%s' "${AZURE_TTS_KEY}" \
            | npx --yes wrangler@3 pages secret put AZURE_TTS_KEY \
              --project-name nasa-hrvatska-v2 >/dev/null
          echo "AZURE_TTS_KEY installed on the Pages project"
          if [ -n "${AZURE_TTS_REGION:-}" ]; then
            printf '%s' "${AZURE_TTS_REGION}" \
              | npx --yes wrangler@3 pages secret put AZURE_TTS_REGION \
                --project-name nasa-hrvatska-v2 >/dev/null
            echo "AZURE_TTS_REGION installed on the Pages project"
          fi

      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true'
        # Pass --commit-message explicitly (subject line only, stripped of non-ASCII) to avoid
        # Cloudflare API error "Invalid commit message, it must be a valid UTF-8 string" [8000111]
        # triggered when wrangler reads the full commit body containing → / — characters.
        run: |
          COMMIT_MSG=$(git log -1 --format='%s' | LC_ALL=C tr -cd '[:print:]' | cut -c1-200)
          npx --yes wrangler@3 pages deploy dist \
            --project-name=nasa-hrvatska-v2 \
            --branch=master \
            --commit-dirty=true \
            --commit-message="$COMMIT_MSG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Scheduled Worker (nasa-hrvatska-scheduler) ───────────────────────────
      # functions/scheduled.js is a SEPARATE Worker from the Pages project: it is
      # the hourly cron that sends each learner's streak reminder. Pushing to
      # master deployed the Pages half and left this one behind, so every change
      # to it needed someone to remember `wrangler deploy` by hand — and the
      # reminder fixes in #398 sat undeployed for exactly that reason. Automating
      # it is the fix; a deploy that depends on memory is not a deploy step.
      #
      # Deliberately NOT filtered on whether functions/scheduled.js changed. The
      # Worker bundles what it imports (functions/_pushKvTtl.js today), so a path
      # filter would silently skip deploys that genuinely changed its behaviour —
      # the same "guard that never fires" class this repo keeps getting bitten by.
      # Redeploying an unchanged Worker is cheap and harmless.
      #
      # Deliberately NOT continue-on-error. A skipped deploy that still shows
      # green is precisely how the Worker fell behind in the first place; if this
      # cannot deploy, master should say so.
      #
      # Secrets set in the dashboard (CRON_SECRET, VAPID_*, PAGES_URL) survive a
      # deploy — `wrangler deploy` replaces code and bindings, not secrets.
      #
      # NOTE: this needs the API token to carry "Workers Scripts: Edit". A token
      # scoped only for Pages will fail here; widen the token rather than muting
      # the step.
      - name: Deploy scheduled Worker (streak-reminder cron)
        if: env.DEPLOY == 'true'
        run: npx --yes wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Managed cron credential, half 2 of 2 (Worker) ────────────────────────
      # The other end of the pair installed before the Pages deploy above. Same
      # label, same key, so the two values are equal by construction rather than
      # by anyone remembering to keep them so.
      #
      # Runs AFTER the Worker deploy because `wrangler secret put` needs the
      # script to exist — on a first-ever deploy it would otherwise fail and take
      # a working release down with it.
      #
      # Deliberately NOT continue-on-error. If this cannot run, the Worker and
      # Pages can drift again, and that failure is the whole thing being fixed —
      # master should say so rather than deploy quietly into the same trap.
      - name: Install managed cron secret (scheduled Worker)
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "nh-cron-v1" \
            | openssl dgst -sha256 -hmac "${CLOUDFLARE_API_TOKEN}" -r | cut -d' ' -f1)
          echo "::add-mask::${TOKEN}"
          printf '%s' "${TOKEN}" | npx --yes wrangler@3 secret put MANAGED_CRON_SECRET >/dev/null
          echo "MANAGED_CRON_SECRET installed on nasa-hrvatska-scheduler"
