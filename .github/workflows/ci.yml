name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  # Manual lever (2026-08-26). Twice now a master run has been created and then
  # never dispatched a single job — 2026-07-27 with a wedged in-progress job,
  # and again today with a repo-wide dispatch stall. In BOTH cases the API had
  # nothing to offer: cancel returns 409 "Cannot cancel a workflow run that has
  # not been queued yet", rerun returns 403 "This workflow is already running".
  # With only push and pull_request triggers, the sole way to free the
  # `CI-refs/heads/master` concurrency group was to push another commit to
  # master — i.e. to fake a change to production in order to retry a deploy.
  # This gives the run an honest retry button instead.
  #
  # A dispatch on master DEPLOYS, exactly as the push it stands in for does —
  # see build-deploy's DEPLOY gate. It did not, at first: the deploy steps were
  # gated on `event_name == 'push'`, so the first real use of this lever (the
  # #549 merge, 2026-08-26) produced a fully green run that shipped nothing and
  # cancelled the push run it replaced, costing a deploy cycle. A retry button
  # that cannot retry the thing that failed is not a retry button.
  workflow_dispatch:

# Cancel any in-progress run for the same branch when a new push arrives.
# Prevents E2E suites from piling up during rapid development (e.g. 6 queued runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: TypeScript + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Content endpoint tests import ETAGS from _etags.js (auto-generated, gitignored).
      # Generator runs as prebuild during npm run build, but this job doesn't build —
      # invoke directly so the file exists before vitest imports the endpoints.
      - name: Generate content ETags (required by endpoint tests)
        run: node scripts/generate-content-etags.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --run

  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts: pure-JS toolchain below (eslint/tsc/prettier/madge/npm audit)
      # doesn't need native binaries from esbuild/sharp/better-sqlite3 postinstalls.
      # Reduces supply-chain blast radius if a transitive dep is compromised.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Dependency security audit
        run: npm audit --audit-level=high --omit=dev

      - name: TypeScript check
        run: npm run typecheck

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}" "functions/**/*.js"

      - name: Circular dependency check
        run: npm run check:circular

      # The Croatian content lint existed as an npm script and was run by hand,
      # which means it was run when someone remembered — the same "guard that
      # never fires" class this repo keeps getting bitten by. It screens every
      # authored content file for encoding bleed (Cyrillic homoglyphs, soft
      # hyphens) and for Serbian forms, using the same rules the live AI output
      # sweep uses. Cheap, deterministic, no network.
      - name: Croatian content lint
        run: npm run lint:croatian

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    # 2026-07-27: added after a wedged runner left this job "in_progress" for
    # 35+ minutes on a step that normally finishes in ~5. With no
    # timeout-minutes it inherited GitHub's 360-minute default, so it could not
    # fail fast and could not self-resolve: cancel_workflow_run returned 202
    # without tearing the job down, and rerun kept returning "This workflow is
    # already running". The run had to be freed by closing/reopening the PR to
    # trip the concurrency group. Meanwhile the PR sat at 13/14 checks, which is
    # exactly the state that tempts someone into merging on an incomplete
    # signal.
    #
    # This TIGHTENS the gate, it does not relax it — an unbounded job is not a
    # stricter check, it is one that can never report. Headroom is deliberate:
    # observed durations are ~4m14s–5m13s, so 20 gives ~4x. That matches the
    # ratio the e2e job already uses (75 for a ~16-minute suite). If the suite
    # legitimately grows past this, raise the number — do not remove it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate content ETags (required by endpoint tests)
        run: node scripts/generate-content-etags.mjs

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 1

  emulator:
    name: Emulator Tests (Firestore)
    runs-on: ubuntu-latest
    # Runs the emulator-backed suites that the default `vitest run` excludes
    # (they need a live Firestore emulator on 127.0.0.1:8080):
    #   - firestore-merge-semantics.test.js — proves set({merge:true}) deep-merge
    #     (guards the 2026-05-28 fbSaveProgress single-write fix, 44e45e1)
    #   - firestore-rules.test.js — security-rules suite (was never CI-gated before)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The Firestore emulator is a JVM process; pin the JDK for reproducibility
      # rather than relying on whatever the runner image ships.
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # firebase-tools is intentionally NOT in package.json — it is large and only
      # this one job needs the `firebase` CLI. Installing it globally here keeps it
      # out of every other job's `npm ci`. Pinned for determinism.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.10.1

      # test:emulator runs BOTH emulator suites (merge-semantics + security-rules)
      # under one emulator boot via vitest.emulator.config.js.
      - name: Firestore emulator suites (merge-semantics + rules)
        run: npm run test:emulator

  e2e:
    name: E2E Tests (Cross-Browser)
    runs-on: ubuntu-latest
    needs: quality
    # 2026-05-22: bumped 45 → 75 — suite has grown substantially since the
    # 17-min historical baseline. Long-term fix is E2E sharding / test pruning.
    timeout-minutes: 75
    # Tests use seedAuth (localStorage injection) + blockFirebase (network abort) fixtures.
    # No live Firebase credentials needed — the app runs in fully hermetic mode.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # 2026-08-19: this install stalled on a GitHub-side download TWICE in one
      # day — once in production-smoke (6h to the default timeout) and once
      # here (75 min to the job cap), where it SKIPPED Build & Deploy and cost
      # a deploy cycle. GitHub Actions has no native step retry, so each
      # attempt is bounded with bash `timeout` and retried once on a stall;
      # the step-level timeout-minutes is the outer bound. Healthy runs take
      # ~2 minutes — everything past that is pure headroom.
      # A timed-out attempt orphans the apt-get child `timeout` doesn't kill,
      # and the orphan keeps holding the apt lock — the retry then dies
      # instantly with "Could not get lock" (seen live, run 32302453122).
      # So between attempts: kill orphaned apt processes and clear their locks.
      - name: Install Playwright browsers (Chrome, Firefox, WebKit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 22
        run: |
          for attempt in 1 2; do
            if timeout 600 npx playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::Playwright install attempt ${attempt} failed or stalled (10-min bound)"
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 -x apt 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
            sudo dpkg --configure -a || true
          done
          echo "::error::Playwright install failed twice — likely an Ubuntu-mirror or GitHub-side outage; re-run the job"
          exit 1

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 22
        run: |
          for attempt in 1 2; do
            if timeout 600 npx playwright install-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::install-deps attempt ${attempt} failed or stalled (10-min bound)"
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 -x apt 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
            sudo dpkg --configure -a || true
          done
          echo "::error::install-deps failed twice — likely an Ubuntu-mirror or GitHub-side outage; re-run the job"
          exit 1

      - name: Build for E2E (with placeholder Firebase config)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'placeholder' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'placeholder.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'placeholder' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'placeholder.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:placeholder' }}
          VITE_SENTRY_DSN: ""

      - name: Run E2E tests — Chrome (full suite)
        run: npx playwright test --project="Desktop Chrome"
        env:
          CI: true

      - name: Run E2E tests — Firefox + WebKit (smoke only)
        # Targeted subset to verify cross-browser compat without exceeding 45-min budget.
        # Full suite × 3 engines ≈ 60 min; smoke-only keeps Firefox+WebKit under 10 min.
        run: |
          npx playwright test \
            --project="Desktop Firefox" \
            --project="Desktop Safari (WebKit)" \
            e2e/navigation.spec.js \
            e2e/auth-edge-cases.spec.js \
            e2e/error-boundary.spec.js
        env:
          CI: true

      - name: Upload E2E report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7

  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # E2E added to the gate (owner decision, 2026-08-18): a red Playwright run
    # now BLOCKS the production deploy. Before this, build-deploy raced e2e —
    # a change that passed unit tests but broke a real user flow deployed to
    # production while E2E was still running. The cost is ~15-35 min added
    # deploy latency (see the e2e job's timeout note); the owner accepted it.
    needs: [quality, test, e2e]
    # ── The deploy gate, defined ONCE ────────────────────────────────────────
    # Every step below that touches Cloudflare reads this one value. It was five
    # copies of `github.event_name == 'push'`; a single expression cannot drift
    # from itself, and there is exactly one place to look to answer "does this
    # run deploy?".
    #
    # THE REF CHECK IS LOAD-BEARING, and is why this is not simply
    # `event_name != 'pull_request'`. `push` only ever fires on master (see the
    # `on:` block), but workflow_dispatch can be started against ANY ref from the
    # Actions UI — without the ref check, dispatching from a feature branch would
    # build that branch and publish it to production under --branch=master. The
    # trigger exists to retry master, not to offer a one-click way to ship
    # unreviewed work.
    #
    # Renders as the STRING 'true'/'false' in env, hence the string comparison.
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Bundle size check
        run: npm run size

      - name: Lighthouse CI
        run: npx lhci autorun
        continue-on-error: true  # NO_FCP is a transient headless-Chrome infra flake — never blocks deploy
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Provision Cloudflare resources (idempotent)
        if: env.DEPLOY == 'true'
        run: node scripts/setup-cf-resources.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Managed cron credential, half 1 of 2 (Pages) ─────────────────────────
      # The scheduled Worker authenticates to /api/streak-push and
      # /api/backup-progress with a shared secret that used to be typed by hand
      # into TWO places with nothing keeping them equal. On 2026-08-23 they
      # drifted: 79 consecutive hourly runs, 0 reminders delivered, every attempt
      # `unauthorized`, and the weekly Firestore backup down beside it.
      #
      # CI now derives the value from a credential it already holds and writes
      # BOTH sides itself, so they cannot disagree. Same derivation and the same
      # public label as calibration.yml's self-provisioned secret — nobody ever
      # pastes anything, and rotating the Cloudflare token re-syncs both halves
      # on the next deploy. The owner's CRON_SECRET is never touched and stays
      # accepted, so this can only ADD a working credential.
      #
      # MUST run BEFORE the Pages deploy: a Pages secret reaches Functions
      # through a new deployment, not the running one.
      - name: Install managed cron secret (Pages)
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "nh-cron-v1" \
            | openssl dgst -sha256 -hmac "${CLOUDFLARE_API_TOKEN}" -r | cut -d' ' -f1)
          echo "::add-mask::${TOKEN}"
          printf '%s' "${TOKEN}" | npx --yes wrangler@3 pages secret put MANAGED_CRON_SECRET \
            --project-name nasa-hrvatska-v2 >/dev/null
          echo "MANAGED_CRON_SECRET installed on the Pages project"

      # ── Firebase service account (Pages) ─────────────────────────────────────
      # FIREBASE_SERVICE_ACCOUNT_JSON has never been set on the Pages project.
      # /api/backup-health's first run (2026-08-26) reported fifteen consecutive
      # config failures: the weekly Firestore backup has NEVER produced a
      # restorable snapshot. The same value also gates /api/delete-account, which
      # fails CLOSED — so a learner asking to delete their account currently gets
      # a 500 and keeps it. And /api/backfill, and the Google TTS fallback.
      #
      # It was treated as a dashboard chore nobody did for years. It is not: this
      # is the same install path the managed cron secret uses, and CI is the one
      # place that writes Pages secrets reliably. Adding it here means the value
      # is set once as a GitHub secret and re-applied on every deploy, and
      # rotating it is a secret update rather than a dashboard visit.
      #
      # UNLIKE the cron secret, CI cannot DERIVE this one — it is a real Google
      # credential. So the step must tolerate its absence: this repo's whole
      # deploy would otherwise go red on a condition that predates the change and
      # that no code can fix. Absent is a loud WARNING (visible in the run
      # summary and in setup-cf-resources.mjs's post-deploy check), never a
      # silent skip — a guard that says nothing is the failure mode this repo
      # keeps rediscovering.
      #
      # PRESENT but uninstallable IS a failure, deliberately not
      # continue-on-error: if we hold the credential and cannot write it, the
      # Functions keep running on a stale or missing value, which is exactly the
      # drift the cron work was done to end.
      #
      # SECRET HYGIENE (this repo is public): the value never reaches argv, a
      # log line, or an error message. It is piped from the environment on
      # stdin, and the shape check below prints only FIELD NAMES and booleans —
      # names never values, the same rule the backup failure codes follow.
      # `set -x` is never enabled in this step.
      #
      # MUST run BEFORE the Pages deploy, for the same reason as the cron half:
      # a Pages secret reaches Functions through a new deployment, not the
      # running one.
      - name: Install Firebase service account (Pages)
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning title=Firebase service account not set::FIREBASE_SERVICE_ACCOUNT_JSON is not a GitHub secret, so it cannot be installed on the Pages project. The weekly Firestore backup produces no restorable snapshot and /api/delete-account fails closed until it is set."
            exit 0
          fi
          # Shape check before install: a malformed paste installed silently is
          # worse than nothing — it turns a clear "missing" into an obscure
          # runtime failure next Monday. node reads the value from the
          # environment, never from argv, and reports only which keys are absent.
          node --input-type=module -e '
            const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "";
            let sa;
            try { sa = JSON.parse(raw); }
            catch { console.error("FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON"); process.exit(1); }
            const missing = ["client_email", "private_key", "project_id"].filter((k) => !sa?.[k]);
            if (missing.length) {
              console.error("service account JSON is missing required field(s): " + missing.join(", "));
              process.exit(1);
            }
            if (sa.type && sa.type !== "service_account") {
              console.error("credential type is " + sa.type + ", expected service_account");
              process.exit(1);
            }
            console.log("service account JSON parsed; required fields present");
          '
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" \
            | npx --yes wrangler@3 pages secret put FIREBASE_SERVICE_ACCOUNT_JSON \
              --project-name nasa-hrvatska-v2 >/dev/null
          echo "FIREBASE_SERVICE_ACCOUNT_JSON installed on the Pages project"

      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true'
        # Pass --commit-message explicitly (subject line only, stripped of non-ASCII) to avoid
        # Cloudflare API error "Invalid commit message, it must be a valid UTF-8 string" [8000111]
        # triggered when wrangler reads the full commit body containing → / — characters.
        run: |
          COMMIT_MSG=$(git log -1 --format='%s' | LC_ALL=C tr -cd '[:print:]' | cut -c1-200)
          npx --yes wrangler@3 pages deploy dist \
            --project-name=nasa-hrvatska-v2 \
            --branch=master \
            --commit-dirty=true \
            --commit-message="$COMMIT_MSG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Scheduled Worker (nasa-hrvatska-scheduler) ───────────────────────────
      # functions/scheduled.js is a SEPARATE Worker from the Pages project: it is
      # the hourly cron that sends each learner's streak reminder. Pushing to
      # master deployed the Pages half and left this one behind, so every change
      # to it needed someone to remember `wrangler deploy` by hand — and the
      # reminder fixes in #398 sat undeployed for exactly that reason. Automating
      # it is the fix; a deploy that depends on memory is not a deploy step.
      #
      # Deliberately NOT filtered on whether functions/scheduled.js changed. The
      # Worker bundles what it imports (functions/_pushKvTtl.js today), so a path
      # filter would silently skip deploys that genuinely changed its behaviour —
      # the same "guard that never fires" class this repo keeps getting bitten by.
      # Redeploying an unchanged Worker is cheap and harmless.
      #
      # Deliberately NOT continue-on-error. A skipped deploy that still shows
      # green is precisely how the Worker fell behind in the first place; if this
      # cannot deploy, master should say so.
      #
      # Secrets set in the dashboard (CRON_SECRET, VAPID_*, PAGES_URL) survive a
      # deploy — `wrangler deploy` replaces code and bindings, not secrets.
      #
      # NOTE: this needs the API token to carry "Workers Scripts: Edit". A token
      # scoped only for Pages will fail here; widen the token rather than muting
      # the step.
      - name: Deploy scheduled Worker (streak-reminder cron)
        if: env.DEPLOY == 'true'
        run: npx --yes wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Managed cron credential, half 2 of 2 (Worker) ────────────────────────
      # The other end of the pair installed before the Pages deploy above. Same
      # label, same key, so the two values are equal by construction rather than
      # by anyone remembering to keep them so.
      #
      # Runs AFTER the Worker deploy because `wrangler secret put` needs the
      # script to exist — on a first-ever deploy it would otherwise fail and take
      # a working release down with it.
      #
      # Deliberately NOT continue-on-error. If this cannot run, the Worker and
      # Pages can drift again, and that failure is the whole thing being fixed —
      # master should say so rather than deploy quietly into the same trap.
      - name: Install managed cron secret (scheduled Worker)
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "nh-cron-v1" \
            | openssl dgst -sha256 -hmac "${CLOUDFLARE_API_TOKEN}" -r | cut -d' ' -f1)
          echo "::add-mask::${TOKEN}"
          printf '%s' "${TOKEN}" | npx --yes wrangler@3 secret put MANAGED_CRON_SECRET >/dev/null
          echo "MANAGED_CRON_SECRET installed on nasa-hrvatska-scheduler"
