# Read-only report of the AI budget ledger (2026-09-29).
#
# The monthly ledger (`ai_month_spend`, see functions/api/_aiBudget.js) was readable only
# through /api/ai-quota-status, which needs a signed-in learner's token. Measuring a change in
# AI spend — e.g. whether the Stretch's extra production slots raised the daily rate — needs
# the ledger itself. This prints the current and previous months' booked spend and the
# current month's daily rate.
#
# It calls /api/ai-ledger rather than the D1 API: CI's Cloudflare token has no D1 scope (the
# first run was refused with "Authentication error"). The route reads the ledger through the
# Pages binding, behind the credential the observatory and calibration sweeps use — derived
# here as HMAC-SHA256(CLOUDFLARE_API_TOKEN, "nh-calibration-v1"), or CRON_SECRET if set. A
# 401/503 means that credential is not provisioned: dispatch the "AI evaluator calibration"
# workflow once.
#
# READ-ONLY: the route writes nothing and makes no AI call. Dispatch only.
name: AI budget ledger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the ledger
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${CRON_SECRET}" ]; then
            TOKEN="${CRON_SECRET}"
          elif [ -n "${CF_TOKEN}" ]; then
            TOKEN=$(printf '%s' "nh-calibration-v1" \
              | openssl dgst -sha256 -hmac "${CF_TOKEN}" -r | cut -d' ' -f1)
          else
            echo "::error::Neither CLOUDFLARE_API_TOKEN nor CRON_SECRET is configured"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          STATUS=$(curl -sS -o ledger.json -w '%{http_code}' -X POST \
            "https://nasahrvatska.com/api/ai-ledger" -H "x-cron-secret: ${TOKEN}")
          if [ "${STATUS}" != "200" ]; then
            cat ledger.json || true
            echo "::error::Ledger read failed with HTTP ${STATUS}"
            exit 1
          fi
          python3 - ledger.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          cap = r['current']['budgetUsd']
          print(f"store: {r['store']}   as of {r['asOf']}")
          print(f"month    booked (USD)  of ${cap:.2f} cap")
          for key in ('current', 'previous'):
              m = r[key]
              usd = m['spentMicroUsd'] / 1e6
              line = f"{m['month']}  ${usd:9.4f}    {usd / cap * 100:5.1f}%"
              if key == 'current':
                  line += f"   ≈ ${m['perDayMicroUsd'] / 1e6:.4f}/day over {m['daysElapsed']} day(s)"
              print(line)
          PY
