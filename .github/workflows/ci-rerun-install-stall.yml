name: Re-run CI after a browser-install stall

# The Playwright install steps in ci.yml stall on GitHub's Ubuntu download
# servers (2026-10-26: the cross-browser job failed twice in a morning, on
# master and on a PR, after 20 minutes each, before any test ran). The failure
# says nothing about the code, and the fix was always the same: re-run the failed
# job. This does that once, and ONLY when every failed step was an install step.
#
# - It re-runs FAILED jobs only (passed jobs are kept).
# - Attempt 1 only: a re-run is attempt 2, whose completion event does not
#   trigger another, so a persistent outage stops after one retry.
# - A test failure, a lint failure or a cancelled run is never retried: the
#   condition is "every failed step is named Install Playwright ...".
# Shares nothing with ci.yml: no cache key, artifact or concurrency group.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: Re-run failed install jobs once
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const failed = jobs.filter((j) => j.conclusion === 'failure');
            const failedSteps = failed.flatMap((j) =>
              (j.steps || []).filter((s) => s.conclusion === 'failure').map((s) => s.name),
            );
            const onlyInstall =
              failed.length > 0 &&
              failedSteps.length > 0 &&
              failedSteps.every((n) => n.startsWith('Install Playwright'));
            if (!onlyInstall) {
              core.info(`Not re-running: failed steps = ${JSON.stringify(failedSteps)}`);
              return;
            }
            core.warning(`Browser install stalled (${failed.map((j) => j.name).join(', ')}); re-running failed jobs once.`);
            await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
