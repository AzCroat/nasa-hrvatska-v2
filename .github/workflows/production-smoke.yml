name: Production Smoke Tests

on:
  schedule:
    # Twice daily — catches outages and bad deploys without excessive noise
    - cron: '0 8,20 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to smoke — leave blank for production. Use a Cloudflare preview URL to check a PR before merging.'
        required: false
        default: ''
  # Note: no push trigger — smoke tests run against the live production URL.
  # A push-triggered run fires before Cloudflare deploys the new build (~2-3 min),
  # so it would always test the previous deployment and produce false failures.

permissions:
  issues: write
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # 2026-08-19: the "Install Playwright browsers" step hung for SIX HOURS on
    # three matrix jobs (a stalled GitHub-side download) before the 360-min
    # default killed them as "cancelled" — alarming status, wasted runner
    # time, zero information. Cap the whole job: install ~2 min + tests ~1
    # min in the healthy case, so 30 min is pure headroom. A timed-out job
    # still reports "cancelled" (not "failed"), so the failure-alert issue
    # correctly stays quiet for infra hangs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [Chrome, Firefox, 'WebKit (Safari)', 'Mobile Chrome', 'Mobile Safari']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same per-attempt bound + one retry as ci.yml's e2e job (2026-08-19):
      # this exact step stalled for six hours on a stalled apt fetch. Each
      # attempt gets 10 minutes via bash timeout; the job cap remains the
      # outer bound. Between attempts, kill the orphaned apt-get that
      # `timeout` leaves behind and clear its locks — without that the retry
      # dies instantly on "Could not get lock" (seen live, run 32302453122).
      # 2026-10-24: the install stalled on GitHub's download servers in three of
      # four scheduled runs (Firefox, WebKit, Firefox) while every browser that
      # DID install loaded the live site fine. Two changes:
      #   1. Install ONLY the engine this matrix entry runs. All three engines
      #      (and every one's system libraries) were being fetched by all five
      #      jobs, which is five times the download that was stalling.
      #   2. A double stall is no longer a job FAILURE. It says nothing about
      #      production, and a red job emails the owner as if the site were
      #      down. The tests are skipped, a warning names the browser, and
      #      `verify-coverage` below fails the run only if too few browsers
      #      actually ran, so monitoring still cannot go silently blind.
      - name: Install Playwright browser
        id: install
        timeout-minutes: 22
        run: |
          case "${{ matrix.browser }}" in
            Chrome|'Mobile Chrome') ENGINE=chromium ;;
            Firefox) ENGINE=firefox ;;
            *) ENGINE=webkit ;;
          esac
          for attempt in 1 2; do
            if timeout 600 npx playwright install --with-deps "$ENGINE"; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Playwright install attempt ${attempt} (${ENGINE}) failed or stalled (10-min bound)"
            sudo pkill -9 apt-get 2>/dev/null || true
            sudo pkill -9 -x apt 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
            sudo dpkg --configure -a || true
          done
          echo "::warning::${{ matrix.browser }} NOT TESTED: browser install failed twice (GitHub-side download problem, not the site)"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests (${{ matrix.browser }})
        if: steps.install.outputs.ok == 'true'
        env:
          # Blank on the scheduled run, so the config falls back to production.
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: |
          npx playwright test \
            --config=playwright.smoke.config.js \
            --project="${{ matrix.browser }}"
        timeout-minutes: 10

      - name: Upload smoke test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report-${{ matrix.browser }}
          path: playwright-smoke-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── Alerting ────────────────────────────────────────────────────────────────
  # HOW THIS WENT SILENT
  # Dedup used to be `if (openSmokeFailureIssues.length === 0) create()`, and
  # nothing ever closed an issue when production recovered. Issue #47 was filed
  # on 2026-06-18, stayed open, and from then on every real failure found a
  # matching open issue and said nothing. Production smoke failed on 2026-08-04
  # and 2026-08-05 and no alert was raised, because a seven-week-old issue was
  # holding the latch down.
  #
  # So dedup must never be able to turn into silence:
  #   - a repeat failure COMMENTS on the existing issue (you learn it recurred)
  #   - a success CLOSES the open issue, which resets the latch automatically
  # One issue per outage, a comment per subsequent failure, closed on recovery.
  alert-on-failure:
    name: Alert on Smoke Failure
    runs-on: ubuntu-latest
    needs: smoke
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Open or update the smoke-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            const { owner, repo } = context.repo;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'smoke-failure',
            });

            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner, repo,
                title: `🚨 Production smoke tests failed — ${now.slice(0, 16)} UTC`,
                body:
                  `## Production is potentially down or broken\n\n` +
                  `Smoke tests failed on scheduled run at ${now}.\n\n` +
                  `**Check immediately:**\n` +
                  `- https://nasahrvatska.com — does the site load?\n` +
                  `- [GitHub Actions run](${runUrl})\n\n` +
                  `This issue was auto-created by the production smoke test workflow. ` +
                  `It closes itself when a scheduled run passes again.`,
                labels: ['smoke-failure', 'bug', 'priority: critical'],
              });
              return;
            }

            // Still failing. Comment rather than staying quiet — the old code
            // returned here and that is exactly how two failures went unreported.
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Still failing as of ${now} — [run](${runUrl}).`,
              });
            }

  # A skipped browser is a warning, not a failure (see the install step), so
  # this job is what keeps "the install stalled" from turning into "nothing was
  # ever checked". It counts the jobs whose tests actually RAN. Fewer than
  # MIN_RAN fails the run (which does notify). Only a run where ALL five ran may
  # close an open smoke-failure issue: a browser that did not run has not
  # recovered.
  verify-coverage:
    name: Verify smoke coverage
    runs-on: ubuntu-latest
    needs: smoke
    if: success() && github.event_name == 'schedule'
    permissions:
      actions: read
    outputs:
      all_ran: ${{ steps.count.outputs.all_ran }}
    steps:
      - name: Count browsers whose tests ran
        id: count
        uses: actions/github-script@v7
        with:
          script: |
            const MIN_RAN = 3;
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            const smoke = jobs.filter((j) => j.name.startsWith('Smoke ('));
            const ran = smoke.filter((j) =>
              (j.steps || []).some((st) => st.name.startsWith('Run smoke tests') && st.conclusion === 'success'),
            );
            for (const j of smoke) {
              if (!ran.includes(j)) core.warning(`${j.name}: tests did not run (browser install failed)`);
            }
            core.setOutput('all_ran', String(smoke.length > 0 && ran.length === smoke.length));
            if (smoke.length === 0 || ran.length < MIN_RAN) {
              core.setFailed(`Only ${ran.length} of ${smoke.length} browsers actually ran their smoke tests — production was not verified.`);
            }

  resolve-on-success:
    name: Close Smoke Failure Issue on Recovery
    runs-on: ubuntu-latest
    needs: [smoke, verify-coverage]
    if: success() && github.event_name == 'schedule' && needs.verify-coverage.outputs.all_ran == 'true'
    steps:
      - name: Close any open smoke-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            // Without this the dedup above degrades into permanent silence the
            // first time an issue is left open. This is the half that was missing.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'smoke-failure',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Production smoke passed on all browsers at ${new Date().toISOString()} — [run](${runUrl}). Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
            }
