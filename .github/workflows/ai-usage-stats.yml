name: ai-usage-stats
# One-shot workflow_dispatch — read-only usage counts from whatever production
# sources the repo's existing secrets can reach. Every probe is best-effort:
# a permission failure prints a clear message and the job continues, so one
# missing token scope never blanks the whole report.
#
# Prints ONLY aggregate counts — never uids, key names, IPs, or tokens.
#
# Probes:
#   1. Cloudflare KV (PUSH_SUBSCRIPTIONS namespace) — push-subscribed users
#      (one key per uid, 90-day TTL) vs quota-fallback keys.
#   2. Sentry release health — sessions + unique users per day, last 14 days
#      (the app calls Sentry.setUser with the Firebase uid on sign-in).
#   3. Cloudflare D1 (AI_QUOTA_DB) — AI users today + all-time. Requires the
#      API token to carry Account → D1 → Read; skipped gracefully otherwise.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: KV — push subscribers vs quota-fallback keys
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # PUSH_SUBSCRIPTIONS namespace — id is public in wrangler.toml/CLAUDE.md
          KV_NAMESPACE_ID: 4652e2388967424db09395a2be0aad81
        run: |
          set -e
          export CLOUDFLARE_API_TOKEN=$(echo -n "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          # wrangler v3 accepts `kv key list` (new) or `kv:key list` (old) — try both.
          LIST=$(npx --yes wrangler@3 kv key list --namespace-id="$KV_NAMESPACE_ID" 2>/dev/null \
              || npx --yes wrangler@3 kv:key list --namespace-id="$KV_NAMESPACE_ID")
          echo "$LIST" | node -e "
            let d = '';
            process.stdin.on('data', (c) => (d += c));
            process.stdin.on('end', () => {
              const keys = JSON.parse(d);
              const quota = keys.filter((k) => k.name.startsWith('quota')).length;
              const subs = keys.length - quota;
              console.log('── Cloudflare KV ──');
              console.log('push_subscribed_users (active within 90d):', subs);
              console.log('kv_quota_fallback_keys:', quota);
            });
          "

      - name: Sentry — sessions + unique users, last 14 days
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -e
          TOKEN=$(echo -n "$SENTRY_AUTH_TOKEN" | tr -d '[:space:]')
          ORG=$(echo -n "$SENTRY_ORG" | tr -d '[:space:]')
          PROJ=$(echo -n "$SENTRY_PROJECT" | tr -d '[:space:]')
          PROJ_ID=$(curl -sf "https://sentry.io/api/0/organizations/$ORG/projects/" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r ".[] | select(.slug == \"$PROJ\") | .id")
          if [ -z "$PROJ_ID" ]; then echo "Sentry: project not found/visible with this token"; exit 1; fi
          echo '── Sentry release health (last 14 days, per day) ──'
          curl -sf "https://sentry.io/api/0/organizations/$ORG/sessions/?project=$PROJ_ID&field=sum(session)&field=count_unique(user)&statsPeriod=14d&interval=1d" \
            -H "Authorization: Bearer $TOKEN" \
            | jq '{
                days: [.intervals, (.groups[0].series["sum(session)"] // []), (.groups[0].series["count_unique(user)"] // [])]
                      | transpose | map({date: .[0], sessions: .[1], unique_users: .[2]}),
                totals: {
                  sessions_14d: (.groups[0].totals["sum(session)"] // 0),
                  unique_users_14d: (.groups[0].totals["count_unique(user)"] // 0)
                }
              }'

      - name: D1 — AI usage (needs D1:Read on the API token)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          export CLOUDFLARE_API_TOKEN=$(echo -n "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          DB=$(npx --yes wrangler@3 d1 list --json 2>/dev/null | node -e "
            let d = '';
            process.stdin.on('data', (c) => (d += c));
            process.stdin.on('end', () => {
              try {
                const dbs = JSON.parse(d);
                const m = dbs.find((x) => /quota/i.test(x.name)) || dbs[0];
                if (m) console.log(m.name);
              } catch {}
            });
          ")
          if [ -z "$DB" ]; then
            echo 'D1 probe skipped: API token lacks Account → D1 → Read.'
            echo 'To enable: Cloudflare → My Profile → API Tokens → edit the deploy token → add D1:Read.'
            exit 1
          fi
          echo "Using D1 database: $DB"
          echo '── AI usage today (UTC day) ──'
          npx --yes wrangler@3 d1 execute "$DB" --remote --json --command "
            SELECT
              SUM(CASE WHEN subject LIKE 'quota:ip:%' THEN 0 ELSE 1 END) AS signed_in_users_today,
              SUM(CASE WHEN subject LIKE 'quota:ip:%' THEN 1 ELSE 0 END) AS anon_ips_today,
              SUM(turns) AS total_turns_today
            FROM ai_quota WHERE window_date = date('now')"
          echo '── Distinct signed-in AI users, all time ──'
          npx --yes wrangler@3 d1 execute "$DB" --remote --json --command "
            SELECT COUNT(*) AS distinct_ai_users_all_time
            FROM ai_quota WHERE subject NOT LIKE 'quota:ip:%'"
