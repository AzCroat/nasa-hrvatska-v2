name: Security Audit

on:
  # Semgrep's findings go to the Security tab via codeql-action/upload-sarif, and
  # GitHub tracks code-scanning alerts PER REF — so without this, the `semgrep`
  # category on the DEFAULT BRANCH was refreshed only by the weekly schedule
  # below: merged code sat up to 7 days unscanned and a finding a merge actually
  # fixed stayed open on master until the next Monday. The identical gap to
  # codeql.yml's, fixed the same way. Measured 2026-09-22 — across 1,123 runs of
  # this workflow, ZERO were push events and the only master runs were weekly.
  #
  # Cost measured before adding, not assumed: Gitleaks 16s (fetch-depth 0 and
  # all) and Semgrep 90s per run, free on a public repo.
  #
  # `master` alone, not `[main, master]` as the pull_request filter says: this
  # repo has no `main` branch. The branch is derived from ci.yml's own deploy ref
  # and pinned by codeqlPushTrigger.test.js — we scan the branch we ship.
  push:
    branches: [master]
  pull_request:
    branches: [main, master]
  # KEPT, and not replaced by the push trigger: this re-scans UNCHANGED code
  # against rules published since, which a push-only workflow never would.
  schedule:
    - cron: '0 7 * * 1'  # Weekly Monday 7am UTC
  workflow_dispatch: # allow manual full-history runs (e.g. to verify .gitleaks.toml)

jobs:
  # Trivy removed 2026-06-06 per owner request. Replacement coverage:
  #  - Dependency CVEs  -> OSV-Scanner + npm audit + Dependabot (security updates ON).
  #  - Secret scanning  -> GitHub native secret scanning + push protection (ON at the
  #    platform level) PLUS the Gitleaks job below for custom patterns + full git history.
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so previously-committed secrets are caught
      # SHA-pinned (gitleaks-action v2). Free for public/personal repos (no license).
      - name: Gitleaks — repo + history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Semgrep — OWASP Top 10 + React + JS patterns
        run: |
          pip install semgrep --quiet
          semgrep --config=auto --sarif --output=semgrep.sarif src/ || true

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
